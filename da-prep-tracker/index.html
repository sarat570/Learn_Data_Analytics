    { q:"A running total query returns unexpected results — the total resets mid-table. What is the most likely cause?", opts:["The SUM() function has a bug","PARTITION BY is splitting the data into groups, resetting the total per group","ORDER BY is missing from the query","The table has NULL values"], ans:1, exp:"A PARTITION BY in the window function's OVER clause restarts the running total for each partition group. If you want one global running total, remove the PARTITION BY and keep only the ORDER BY." },
    { q:"What does PERCENT_RANK() return for a row?", opts:["The row's value as a percentage of the maximum","The row's rank as a percentage of the total number of rows (0 to 1)","The percentage change from the previous row","The percentage of rows the current row is greater than"], ans:1, exp:"PERCENT_RANK() = (rank - 1) / (total rows - 1), returning a value between 0 and 1. The lowest-ranked row is always 0; the highest is always 1. Used for percentile calculations." },
    { q:"You want a 7-day rolling average of daily revenue. Which frame is correct?", opts:["ROWS BETWEEN 7 PRECEDING AND CURRENT ROW","ROWS BETWEEN 6 PRECEDING AND CURRENT ROW","ROWS BETWEEN CURRENT ROW AND 7 FOLLOWING","ROWS BETWEEN UNBOUNDED PRECEDING AND 7 FOLLOWING"], ans:1, exp:"A 7-day rolling average includes today plus the 6 days before it — 7 rows total. ROWS BETWEEN 6 PRECEDING AND CURRENT ROW gives you the current row and the 6 preceding ones." },
    { q:"What does SUM(revenue) OVER () (empty OVER clause) return?", opts:["Revenue for the current row only","NULL for every row","The grand total of all revenue, repeated on every row","An error — OVER cannot be empty"], ans:2, exp:"An empty OVER() with no PARTITION BY or ORDER BY treats the entire result set as one partition. SUM(revenue) OVER () gives the total across all rows, repeated on every row — commonly used to calculate percentage-of-total (revenue / SUM(revenue) OVER ())." },
    { q:"What is the difference between a window function and GROUP BY?", opts:["No difference — both produce the same output","GROUP BY collapses rows; window functions keep all rows and add computed values alongside","Window functions are always slower than GROUP BY","GROUP BY works on all columns; window functions only work on numeric columns"], ans:1, exp:"GROUP BY reduces many rows to one per group. Window functions compute over a group but keep every original row — you get both the detail and the aggregate value side by side." },
    { q:"You want to number duplicate payment rows so you can delete all but the first. Which function do you use?", opts:["RANK()","DENSE_RANK()","ROW_NUMBER()","COUNT()"], ans:2, exp:"ROW_NUMBER() gives every row a unique number — even exact duplicates get different numbers. This lets you identify rows 2, 3, 4... within a duplicate group for deletion. RANK and DENSE_RANK would give all duplicates the same number, making deletion logic ambiguous." },
    { q:"What does CUME_DIST() return for a row?", opts:["The cumulative revenue up to this row","The fraction of rows with values less than or equal to the current row's value","The row's rank as an integer","The distance in days from the first row"], ans:1, exp:"CUME_DIST() = number of rows with value ≤ current row / total rows. A row with CUME_DIST() of 0.8 means 80% of rows have a value less than or equal to it — useful for identifying which percentile a value falls in." },
    { q:"Why write the window frame explicitly even when it is the default?", opts:["It is required by BigQuery syntax","It proves to interviewers that you understand frames, not just syntax — and it prevents silent bugs if PARTITION BY is later added","It makes queries run faster","The default frame changes between SQL dialects so always write it"], ans:1, exp:"Writing ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW explicitly signals real understanding of window frames. It also prevents a subtle bug: the default frame changes from RANGE UNBOUNDED PRECEDING when you add ORDER BY, which can silently change behaviour." },
    { q:"Which window function would you use to compare each order to the customer's very last order?", opts:["LAG()","FIRST_VALUE()","LAST_VALUE()","ROW_NUMBER()"], ans:2, exp:"LAST_VALUE() returns the value from the last row in the window frame. However, the default frame only extends to the current row — you must explicitly set the frame to ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING to get the true last value in the partition." },
    { q:"What does PARTITION BY do to the window frame's row count?", opts:["It has no effect on row counts","It limits the window to only the rows within each partition group","It doubles the number of rows processed","It removes NULL rows from the window"], ans:1, exp:"PARTITION BY restricts each window function's computation to only the rows sharing the same partition value. A table with 1000 rows and 10 customers PARTITIONED BY customer_id processes 100-row windows per customer." },
    { q:"How do you calculate month-over-month growth % using LAG()?", opts:["(current - LAG(current)) / current * 100","(current - LAG(current)) / LAG(current) * 100","LAG(current) / current * 100","(LAG(current) - current) / current * 100"], ans:1, exp:"MoM growth = (current period - previous period) / previous period × 100. The denominator is the LAG value (prior period), not the current — this gives the percentage change relative to where you started." },
    { q:"A window function with PARTITION BY user_id, ORDER BY date and ROW_NUMBER gives results of 1,2,3 for user 101 and then 1,2 for user 102. Is this correct?", opts:["No — row numbers must be sequential across the entire table","Yes — ROW_NUMBER resets to 1 for each new PARTITION BY group","No — the numbers should continue from where user 101 left off","Yes, but only if there are no NULL dates"], ans:1, exp:"This is exactly correct. PARTITION BY user_id creates an independent window per user. ROW_NUMBER resets to 1 at the start of each new partition — user 101 gets 1,2,3 and user 102 independently gets 1,2." },
    { q:"What is the correct syntax to get the 3rd row's value in a window?", opts:["OFFSET(col, 3)","LAG(col, 3)","NTH_VALUE(col, 3)","SKIP(col, 3)"], ans:2, exp:"NTH_VALUE(column, n) returns the value from the nth row of the window frame. LAG(col, n) looks n rows back from the current row. NTH_VALUE always measures from the start of the frame." },
    { q:"You want to flag the most recent order per customer. Which approach is correct?", opts:["WHERE MAX(order_date)","HAVING MAX(order_date)","ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC) = 1","MAX(order_date) OVER (PARTITION BY customer_id)"], ans:2, exp:"ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date DESC) = 1 assigns rank 1 to the most recent order per customer. Wrapping it in a CTE or subquery then filtering WHERE rn = 1 gives exactly one row per customer — the latest order." },
  ]},
  { topic:"Python & Statistics", questions:[
    { q:"You have a revenue column with large outliers. Which imputation is better for missing values?", opts:["Mean — uses all available data","Median — robust to outliers and skew","Mode — most frequent value is safest","Drop rows — avoids bias"], ans:1, exp:"Mean is dragged upward by outliers (a single ₹50L enterprise order). Median is the middle value and stays stable regardless of extremes — the correct default for right-skewed business data like revenue." },
    { q:"What does errors='coerce' do in pd.to_datetime(col, errors='coerce')?", opts:["Raises an error on bad dates","Converts bad dates to NaT instead of crashing","Replaces bad dates with today's date","Skips the column if any value is invalid"], ans:1, exp:"errors='coerce' silently converts unparseable values to NaT (Not a Time) rather than raising an exception — letting your pipeline continue while making bad data visible as nulls." },
    { q:"Why use IQR instead of Z-score for outlier detection on revenue data?", opts:["IQR is faster to compute","Z-score assumes normality; revenue is usually right-skewed so IQR is safer","Z-score only works on categorical data","They produce identical results"], ans:1, exp:"Z-score flags values beyond ~3 standard deviations from the mean — only reliable on normally distributed data. Revenue is almost always right-skewed. IQR (Q1-1.5×IQR to Q3+1.5×IQR) makes no normality assumption." },
    { q:"What is the correct Pandas boolean mask to filter rows where revenue > 1000?", opts:["df.filter(revenue > 1000)","df.where('revenue > 1000')","df[df['revenue'] > 1000]","df.select(revenue > 1000)"], ans:2, exp:"df[condition] is standard Pandas boolean masking. df['revenue'] > 1000 creates a True/False Series; wrapping it in df[...] returns only True rows — equivalent to SQL's WHERE clause." },
    { q:"What is the difference between statistical and practical significance?", opts:["They mean the same thing","Statistical significance means unlikely to be random noise; practical significance means the effect is large enough to matter for a decision","Statistical significance only applies to A/B tests","p < 0.05 automatically means the result is practically significant"], ans:1, exp:"A tiny lift (0.1%) can be statistically significant on a huge sample but practically useless. Always pair a p-value with the actual effect size and business impact before recommending action." },
    { q:"What does df.groupby('category').agg({'revenue': 'sum'}) do?", opts:["Sorts the dataframe by category then revenue","Filters rows where category is not null","Returns one row per category with the total revenue for each — like SQL GROUP BY with SUM","Returns the average revenue across all categories"], ans:2, exp:"groupby() + agg() is the Pandas equivalent of SQL's GROUP BY + SUM. It collapses rows with the same category into one, computing the specified aggregation for each." },
    { q:"Why fill missing categorical values with 'Unknown' instead of dropping the rows?", opts:["'Unknown' is faster to process","Dropping rows loses information — rows with missing segment might still have valid revenue. Flagging preserves auditability","NULL values cause Pandas to crash","Dropping rows is always the correct approach"], ans:1, exp:"Dropping rows silently removes data you might need later — e.g. 'how much revenue came from unknown-segment customers?'. Explicit 'Unknown' flags preserve those rows for analysis while clearly marking them as incomplete." },
    { q:"What is a p-value in plain terms?", opts:["The probability that the experiment result is correct","The probability of seeing a result at least this extreme if there were truly no difference between groups","The percentage improvement of variant B over variant A","The confidence level of the experiment"], ans:1, exp:"A p-value answers: 'if the null hypothesis (no real difference) were true, how likely would we be to see this result by chance?' Low p-value = unlikely to be chance. It does NOT tell you the size or importance of the effect." },
    { q:"What does df.describe() show?", opts:["The first 5 rows of the dataframe","Column data types and null counts","Summary statistics (count, mean, std, min, quartiles, max) for numeric columns","The shape of the dataframe"], ans:2, exp:"df.describe() generates a statistical summary of numeric columns — count, mean, standard deviation, min, 25th/50th/75th percentiles, and max. Extremely useful for a quick data health check at the start of any EDA." },
    { q:"What is skewness and why does it matter for outlier detection?", opts:["Skewness measures how many NULL values exist","Skewness measures asymmetry of distribution — right-skewed data has a long right tail which makes Z-score unreliable for outlier detection","Skewness only applies to categorical data","Skewness is the same as variance"], ans:1, exp:"Right-skewed distributions (most business revenue data) have a long right tail from extreme values. Z-score assumes symmetry — so it flags fewer true outliers on the right. IQR, being based on medians and quartiles, is more reliable on skewed data." },
    { q:"What does np.where(condition, value_if_true, value_if_false) do?", opts:["Filters rows where condition is true","Creates a new array/column applying the condition to every element — vectorised if/else","Finds the index where the condition is first true","Raises an error if any element does not meet the condition"], ans:1, exp:"np.where() is a vectorised conditional — it applies the true/false logic element-by-element across the entire column without a Python loop. The Pandas equivalent of a CASE WHEN in SQL." },    { q:"What is the interquartile range (IQR)?", opts:["The range from minimum to maximum","Q3 minus Q1 — the range containing the middle 50% of values","The average of the 1st and 3rd quartiles","The standard deviation of the middle 50% of values"], ans:1, exp:"IQR = Q3 (75th percentile) - Q1 (25th percentile). It measures the spread of the middle half of the data, ignoring extreme values. The outlier bounds are Q1 - 1.5×IQR (lower) and Q3 + 1.5×IQR (upper)." },
    { q:"What does df.merge(df2, on='customer_id', how='left') do?", opts:["Concatenates df and df2 vertically","Keeps all rows from df and matches rows from df2 on customer_id; NULLs where no match","Returns only rows with a matching customer_id in both dataframes","Appends all rows from df2 to df"], ans:1, exp:"df.merge() with how='left' is a LEFT JOIN — keeps every row from the left dataframe (df) and brings in matching columns from df2. Unmatched rows from df get NaN for df2's columns." },
    { q:"What does df['col'].apply(lambda x: x*2) do?", opts:["Filters rows where col > 2","Applies the function to every value in the column, returning a new Series with doubled values","Applies the function to every row of the dataframe","Modifies the column in place"], ans:1, exp:"apply() runs a function on each element of a Series. For simple element-wise operations, vectorised alternatives (df['col'] * 2) are faster — but apply() is useful for complex row-level logic that can't be vectorised." },
    { q:"What is the difference between df.dropna() and df.fillna()?", opts:["dropna removes columns; fillna removes rows","dropna removes rows (or columns) containing NaN; fillna replaces NaN with a specified value","They are interchangeable","dropna only works on numeric columns; fillna only works on text columns"], ans:1, exp:"dropna() removes rows/columns containing NaN — losing data. fillna() replaces NaN with a specified value (median, mean, 'Unknown', 0) — preserving row count. Choose based on whether the missing data can be meaningfully imputed." },
    { q:"What does df.isnull().sum() tell you?", opts:["The total number of rows in the dataframe","The number of missing values per column","The number of duplicate rows","The percentage of null values across the entire dataframe"], ans:1, exp:"df.isnull() creates a True/False dataframe of the same shape. .sum() then adds up the True values column by column — giving you a count of missing values for each column. This is the standard first step of any EDA." },
    { q:"What is a Type I error in hypothesis testing?", opts:["Failing to detect a real effect (false negative)","Detecting an effect that doesn't really exist (false positive)","Using the wrong statistical test","Having too small a sample size"], ans:1, exp:"Type I error = false positive — rejecting the null hypothesis when it is actually true. In A/B testing, this means declaring a winner when the difference is actually random noise. The significance level alpha (typically 0.05) is the maximum acceptable probability of a Type I error." },
    { q:"You want to detect a 5% change in conversion rate with 95% confidence. What increases statistical power?", opts:["Shorter experiment duration","Smaller sample size","Larger sample size and lower noise in the metric","Using a less precise measurement"], ans:2, exp:"Statistical power — the ability to detect a real effect — increases with sample size (more data reduces noise) and decreases with metric variance. Running the test longer (to accumulate more observations) is the standard remedy for underpowered experiments." },
    { q:"What does df.shape return?", opts:["The column names of the dataframe","A tuple of (number of rows, number of columns)","The data types of each column","The memory usage of the dataframe"], ans:1, exp:"df.shape returns a tuple like (1000, 12) — 1000 rows and 12 columns. Always check this early in EDA to confirm you loaded the right dataset and have the expected volume of data." },
    { q:"What is the correct way to handle a date column that imported as a string object type?", opts:["Use df['date'].astype(int)","Use pd.to_datetime(df['date'], errors='coerce') to convert to proper datetime","Use df['date'].str.to_date()","Ignore it — string dates work in most Pandas operations"], ans:1, exp:"String dates block date arithmetic, groupby('month'), and time-series operations. pd.to_datetime() converts them to proper datetime64 — after which you can use dt.month, dt.year, dt.dayofweek and resample by time period." },
    { q:"What is the purpose of df.duplicated().sum()?", opts:["Counts the number of unique values in the dataframe","Counts the number of fully duplicate rows in the dataframe","Removes duplicate rows from the dataframe","Identifies which columns have the most repeated values"], ans:1, exp:"df.duplicated() returns True for every row that is an exact copy of an earlier row. .sum() counts those Trues — giving you the total number of duplicate rows. This is a standard early-EDA check." },
    { q:"What does a correlation of -0.85 between two variables mean?", opts:["A weak positive relationship","A strong positive relationship","A strong negative relationship — as one increases, the other tends to decrease","No relationship between the variables"], ans:2, exp:"Correlation ranges from -1 to +1. -0.85 indicates a strong negative linear relationship — when one variable increases, the other tends to decrease strongly. But correlation ≠ causation; always check for confounds." },
    { q:"What is the difference between a population parameter and a sample statistic?", opts:["No difference — they measure the same thing","A population parameter describes the entire group; a sample statistic estimates it from a subset","A sample statistic is always more accurate than a population parameter","Population parameters only apply to census data"], ans:1, exp:"In analytics you almost never have full population data. A sample statistic (mean of 1000 users) estimates the true population parameter (mean of all users) with some uncertainty — captured by confidence intervals and p-values." },
    { q:"You ran an experiment for 3 days and got p=0.04. Should you call it significant?", opts:["Yes — p < 0.05 means it is significant regardless of duration","Not necessarily — 3 days may not capture weekly seasonality and early stopping inflates false positive rates","No — you need p < 0.01 for short experiments","Yes — the shorter the experiment, the more reliable the result"], ans:1, exp:"Early stopping is a common A/B testing mistake. Running for less than one full weekly cycle misses weekend/weekday seasonality effects. Peeking at results and stopping early also inflates Type I error rates beyond the stated alpha level." },
    { q:"What does std (standard deviation) tell you about a dataset?", opts:["The most common value in the dataset","The average distance of each data point from the mean — a measure of spread","The range from minimum to maximum","The middle value of the dataset"], ans:1, exp:"Standard deviation measures how spread out values are around the mean. A low std means values are clustered close to the mean; a high std means they are spread widely. It is sensitive to outliers — a reason to also report IQR for skewed data." },
  ]},
  { topic:"Power BI & DAX", questions:[
    { q:"Why must you mark a table as an official Date Table in Power BI?", opts:["It speeds up data loading","It enables time-intelligence functions like DATEADD and DATESINPERIOD to work correctly","It automatically creates date hierarchies","It prevents users from editing date values"], ans:1, exp:"DATEADD, DATESINPERIOD, SAMEPERIODLASTYEAR and other time-intelligence functions require a continuous, gap-free date column. Marking the Date Table tells Power BI's engine which column qualifies — without this, these functions silently return blank or wrong results." },
    { q:"What does CALCULATE() do in DAX?", opts:["Performs arithmetic on columns","Evaluates an expression under a modified filter context","Creates a new calculated column","Replaces SUMX for simple aggregations"], ans:1, exp:"CALCULATE evaluates any expression while replacing or adding to the current filter context — it is DAX's most important and most-used function. CALCULATE([Total Revenue], DATEADD(...)) computes revenue in a different time period while the visual stays on the current month." },
    { q:"What does DIVIDE(a, b) do differently from a/b in DAX?", opts:["DIVIDE is more accurate","DIVIDE returns BLANK instead of an error when b is zero; a/b errors on division by zero","They behave identically","DIVIDE only works on integer columns"], ans:1, exp:"Plain division errors when the denominator is zero. DIVIDE(a, b) returns BLANK (null) instead — the DAX equivalent of BigQuery's SAFE_DIVIDE. Always use DIVIDE for business metrics where a zero denominator is possible." },
    { q:"In a star schema, why is cross-filter direction set to Single by default?", opts:["Single direction is faster","It prevents ambiguous filter propagation that can break measures when multiple relationships exist","Single direction is required for all DAX aggregations","Direction only matters when using CALCULATE"], ans:0, exp:"Bidirectional cross-filtering can cause circular or ambiguous filter paths when multiple relationships exist, leading to unexpected results. Single direction (dimension filters fact) is the safe default — add bidirectional only with a specific, understood reason." },
    { q:"What is the grain of a fact table?", opts:["The number of columns","The level of detail each row represents — e.g., one row per order line item","The primary key column name","The number of rows"], ans:1, exp:"Grain defines what exactly one row means. Getting it wrong (mixing order-level and line-item-level rows) causes double-counting in aggregations — one of the most common BI modelling errors." },
    { q:"What does DATEADD(DIM_Date[full_date], -1, MONTH) do in a CALCULATE context?", opts:["Adds one month to the current filter","Shifts the date filter context back by one month","Returns all dates in the previous year","Filters only the first day of the previous month"], ans:1, exp:"DATEADD shifts the filter context on the marked Date Table by the specified interval. -1 MONTH moves the filter to the equivalent period one month earlier — the standard pattern for prior-period comparisons." },
    { q:"What is the difference between a calculated column and a measure in DAX?", opts:["No difference — both are computed at query time","A calculated column is computed row-by-row at data refresh and stored; a measure is computed dynamically at query time in response to filter context","Calculated columns work only on text; measures work only on numbers","Measures are faster than calculated columns in all scenarios"], ans:1, exp:"Calculated columns add a new column to a table computed once at refresh — they consume memory. Measures are evaluated on demand in response to the current filter context — they are more flexible and memory-efficient for aggregations." },
    { q:"What does SUMX(table, expression) do?", opts:["Sums all values in a column directly","Iterates row-by-row through the table evaluating the expression per row, then sums the results","Returns the sum of a column filtered by a condition","Calculates a running sum"], ans:1, exp:"SUMX is an iterator — it evaluates the expression once per row of the table (e.g. [Quantity] * [Unit Price]) and then sums all those results. This is how you calculate revenue when it is not pre-stored as a column." },
    { q:"What is filter context in DAX?", opts:["The WHERE clause equivalent in DAX","The set of filters currently active on a visual — from slicers, page filters, or CALCULATE — that determines which rows a measure sees","The PARTITION BY equivalent in DAX","The filter applied inside a SUMX iteration"], ans:1, exp:"Filter context is the collection of active filters (from slicers, row/page filters, and CALCULATE arguments) that restricts which rows are visible when a measure runs. Understanding filter context is the key to understanding why DAX measures return the values they do." },
    { q:"What does ALL(table) do inside CALCULATE?", opts:["Keeps all existing filters on the table","Removes all filters from the specified table — used for % of total calculations","Applies the table as a filter","Duplicates the current filter context"], ans:1, exp:"ALL() clears filters from a table or column, ignoring any slicers or page filters on it. The classic use: [Revenue] / CALCULATE([Revenue], ALL(DIM_Product)) gives revenue as a % of the grand total regardless of which product is selected." },
    { q:"What does RELATED() do in a DAX calculated column?", opts:["Performs a lookup across an unrelated table","Fetches a value from a related table along an established relationship — like a JOIN lookup","Filters the related table by a condition","Creates a new relationship between tables"], ans:1, exp:"RELATED() traverses an existing model relationship to retrieve a column value from a related table — the DAX equivalent of a SQL JOIN lookup in a calculated column context. It only works in row context (inside a calculated column or SUMX iteration)." },
    { q:"Which DAX function calculates year-to-date total?", opts:["TOTALYTD(expression, date_column)","YEARSUM(expression)","DATESYTD(date_column)","CUMULATIVETOTAL(expression, YEAR)"], ans:0, exp:"TOTALYTD(expression, date_column) calculates the expression from the start of the calendar year (or fiscal year start if specified) to the last date in the current filter context. It is a convenient wrapper around CALCULATE with DATESYTD()." },
    { q:"What does SAMEPERIODLASTYEAR(date_column) do?", opts:["Returns data for the same month last quarter","Returns the equivalent date range from exactly one year ago","Returns data for the first month of last year","Returns a rolling 12-month average"], ans:1, exp:"SAMEPERIODLASTYEAR shifts the filter to the equivalent dates one year prior. If the current context is March 2026, it filters to March 2025 — the standard pattern for year-over-year comparison." },
    { q:"What is the purpose of a bridge table in a data model?", opts:["To speed up DAX measure calculations","To resolve many-to-many relationships between two tables","To store date information","To link fact tables to each other directly"], ans:1, exp:"Many-to-many relationships (e.g. a customer can have many products and a product can be bought by many customers) cannot be modelled with a direct relationship. A bridge (junction) table between the two resolves this into two one-to-many relationships." },
    { q:"What does HASONEVALUE(column) return?", opts:["TRUE if the column has exactly one row","TRUE if the current filter context has filtered the column down to exactly one value — used to guard dynamic titles or single-value calculations","The single filtered value of the column","FALSE if the column is empty"], ans:1, exp:"HASONEVALUE() returns TRUE when the filter context has narrowed a column to exactly one value — e.g. when a single product is selected in a slicer. Commonly used to conditionally display dynamic titles or values that only make sense for a single selection." },
    { q:"What is the difference between KEEPFILTERS and FILTER inside CALCULATE?", opts:["No difference — both achieve the same result","FILTER creates a new table to filter on; KEEPFILTERS adds a filter while preserving existing ones — it restricts rather than replaces context","KEEPFILTERS removes all existing filters first","FILTER is faster than KEEPFILTERS"], ans:1, exp:"By default CALCULATE replaces existing filters with its arguments. KEEPFILTERS() modifies this behaviour — instead of replacing, it intersects the new filter with the existing filter context, narrowing rather than overriding it." },
    { q:"What is a disconnected table in Power BI and when would you use it?", opts:["A table with no data","A table with no relationship to the data model, used to drive slicer-based 'what-if' parameters or dynamic measure selectors","A table that has been accidentally deleted from the model","A table used only for calculated columns"], ans:1, exp:"A disconnected table has no relationship to the rest of the model. It is used to build parameter slicers (e.g. select which measure to display) where a DAX measure uses SELECTEDVALUE() to read the user's choice and return the appropriate calculation." },
    { q:"What does AVERAGEX(DATESINPERIOD(...), [Total Revenue]) compute?", opts:["The average revenue across all time","A static average that ignores the current filter","A rolling average over the date window defined by DATESINPERIOD, re-evaluated at each date in the current context","The average of the last 3 values in the dataset"], ans:2, exp:"AVERAGEX iterates over each date in the DATESINPERIOD window, evaluates [Total Revenue] for that date, then averages the results. As the visual's filter context changes month by month, the window moves with it — giving a true dynamic rolling average." },
    { q:"What does INTERSECT(table1, table2) return in DAX?", opts:["All rows from both tables combined","Only the rows that appear in both table1 and table2","The difference between the two tables","A cross join of both tables"], ans:1, exp:"INTERSECT returns only the rows present in both input tables — the DAX equivalent of an INNER JOIN or SQL INTERSECT. Used in retention calculations to find customers active in both the current and prior period." },
    { q:"What is row context in DAX?", opts:["The same as filter context — both restrict rows","Row context exists inside iterators like SUMX/AVERAGEX — DAX processes the expression once per row as if stepping through a table","The context created by a page-level filter","The context from a CALCULATE filter argument"], ans:1, exp:"Row context is created by iterator functions (SUMX, AVERAGEX, FILTER, calculated columns). DAX evaluates the expression once per row, with each row temporarily 'in context'. CALCULATE inside a row context converts it to filter context — this transition is the deepest concept in DAX." },
    { q:"Why would a DATEADD measure return BLANK for the first period in your dataset?", opts:["DATEADD always returns blank on the first run","There is no prior period to compare to — the prior-period filter returns an empty date range, so the measure evaluates to blank","DATEADD requires a minimum of 12 months of data","The Date Table is not sorted correctly"], ans:1, exp:"DATEADD shifts the filter back by the specified interval. For the first month in your data, there is no data one month prior — the shifted filter matches no rows and the measure returns BLANK. This is correct behaviour; handle it in visuals with a BLANK check or by suppressing the first period." },
    { q:"What is the correct DAX pattern for percentage of total revenue per category?", opts:["[Category Revenue] / [Total Revenue]","DIVIDE([Revenue], CALCULATE([Revenue], ALL(DIM_Product)))","DIVIDE([Revenue], SUMX(DIM_Product, [Revenue]))","[Revenue] / MAX([Revenue])"], ans:1, exp:"ALL(DIM_Product) removes the product/category filter from the denominator's calculation, giving the grand total regardless of which category is selected. DIVIDE handles division by zero. This is the canonical % of total pattern in DAX." },
    { q:"What does USERELATIONSHIP() do in DAX?", opts:["Creates a new relationship between two tables","Activates an inactive relationship for the duration of a CALCULATE expression","Removes an existing relationship temporarily","Changes the cross-filter direction of a relationship"], ans:1, exp:"A data model can have only one active relationship between two tables, but can store additional inactive relationships. USERELATIONSHIP() inside CALCULATE activates one of those inactive relationships for the duration of that measure — e.g. filtering orders by ship date instead of order date." },
    { q:"What happens if you use a SUM measure in a row context without CALCULATE?", opts:["It returns the sum for the entire table, ignoring row context","It sums only the current row's value","It returns an error","It returns BLANK"], ans:0, exp:"A measure referenced inside a row context (e.g. inside SUMX) automatically triggers an implicit CALCULATE, converting row context to filter context. So SUM([Revenue]) inside SUMX evaluates the total revenue filtered to the current row's context — not just the row's individual value." },
    { q:"What is the purpose of a date hierarchy in Power BI?", opts:["To sort dates alphabetically","To automatically provide Year → Quarter → Month → Day drill-down in visuals without creating separate columns","To link the date table to the fact table","To filter only working days"], ans:1, exp:"When a proper Date Table is marked, Power BI auto-generates a Year/Quarter/Month/Day hierarchy. This enables one-click drill-down in any visual — clicking a year expands to quarters, then months, then days — without any manual DAX or column creation." },
  ]},
  { topic:"Product Metrics", questions:[
    { q:"A product's MAU grows but DAU/MAU falls. What does this indicate?", opts:["Healthy growth — more monthly users is always good","Users are becoming more habitual","The product is adding occasional users but failing to build daily habit","DAU and MAU always move together"], ans:2, exp:"DAU/MAU (stickiness) measures what fraction of monthly users engage on a typical day. Rising MAU + falling stickiness means you are adding users who open the app rarely — a warning sign unless your product's natural frequency is inherently low." },
    { q:"Retention dropped 8% last week. What is the FIRST thing to check?", opts:["Segment by geography","Check competitor activity","Verify the analytics tracking has not changed — the drop might be a measurement artifact","Rollback the last release immediately"], ans:2, exp:"Before assuming a real product problem, confirm the measurement itself is valid. A broken SDK, a mis-fired event tag, or a logging change can create a fake metric drop. This QA-native instinct is the one most analysts skip." },
    { q:"What is the difference between a leading and a lagging indicator?", opts:["Lagging indicators are more accurate","Leading indicators predict future outcomes (act on now); lagging indicators confirm what already happened (report on past)","They refer to the order metrics appear on a dashboard","Leading indicators are financial; lagging are operational"], ans:1, exp:"Revenue is lagging — it confirms last quarter. Week-1 activation rate is leading — it predicts 3-month retention. Strong analysts name both and explain which metric drives which decision." },
    { q:"Which metric best measures whether a product builds habitual daily use?", opts:["Total signups","Monthly Active Users","DAU/MAU stickiness ratio","Total revenue"], ans:2, exp:"DAU/MAU directly captures the fraction of your monthly users who return on a typical day. Total signups and MAU can grow even while users are churning — they are vanity metrics without stickiness context." },
    { q:"A cohort analysis shows recent cohorts retaining worse than 6-month-old cohorts. What does this most likely mean?", opts:["Overall retention is improving","A recent change degraded the new-user experience","Long-term users are churning","The data is incorrect"], ans:1, exp:"Cohort analysis isolates lifecycle effects. Stable old cohorts + deteriorating new cohorts points to something that changed recently — a release, a pricing change, or a new acquisition channel bringing lower-intent users." },
    { q:"What is a North Star Metric?", opts:["The most recent metric on a dashboard","The single metric best capturing core product value and long-term business success","The highest-value customer segment","The metric with the highest correlation to revenue"], ans:1, exp:"The North Star aligns all teams around one thing. Spotify: time spent listening. Airbnb: nights booked. It should capture genuine user value — not just revenue — because it predicts revenue rather than measuring it after the fact." },
    { q:"What is the difference between D1, D7, and D30 retention?", opts:["They measure retention at different company stages","D1 = % of users who return on day 1 after signup; D7 = day 7; D30 = day 30 — each benchmarks stickiness at a different lifecycle stage","D1 is for daily apps; D7 is for weekly apps; D30 is for monthly apps","They are different ways to calculate the same metric"], ans:1, exp:"D1/D7/D30 retention = % of users who signed up on day 0 and were active again on day 1/7/30. Each tells you something different: D1 catches first-session friction, D7 captures early habit formation, D30 reveals sustained value." },
    { q:"Feature adoption is 8% vs a 25% target. Before recommending fixes, what do you verify first?", opts:["Run a push notification campaign","Check if adopters retain better than non-adopters — confirm the feature drives value before investing in adoption","Redesign the feature UI","Remove the feature"], ans:1, exp:"If adopters do not retain better than non-adopters, pushing more users to the feature will not help the business — you'd only be optimising a vanity adoption metric. First prove the feature drives the outcome, then figure out why adoption is low." },
    { q:"DAU dropped 20% on a Tuesday. Revenue is flat. What is the most likely explanation?", opts:["A major product bug","A tracking/logging failure undercounting active users","Seasonal Tuesday effect","A competitor launched"], ans:1, exp:"A 20% DAU drop with flat revenue is almost certainly a tracking problem — real user loss at that scale would almost always show in revenue. Mismatched signals across metrics is the clearest sign of a data quality issue." },
    { q:"What is churn rate?", opts:["The rate at which new users sign up","The percentage of users who stop using the product in a given period","The ratio of active to inactive users","The rate at which revenue grows"], ans:1, exp:"Churn = % of existing users (or revenue) lost in a period. It is the complement of retention rate (Retention = 1 - Churn). High churn is unsustainable — it means the 'leaky bucket' empties as fast as you fill it with new acquisitions." },
    { q:"What does LTV (Lifetime Value) represent?", opts:["The total revenue from a product line","The total revenue a business can expect from a single customer over their entire relationship","The average order value","The cost to acquire a customer"], ans:1, exp:"LTV (or CLV) = the total revenue (or profit) expected from a customer over their lifetime. It must be compared to CAC (Customer Acquisition Cost) — a healthy business has LTV significantly higher than CAC, typically LTV/CAC > 3." },
    { q:"What does an activation metric measure?", opts:["When a user first downloads the app","The moment a new user first experiences the core value the product promises — the 'aha moment'","When a user makes their first purchase","When a user refers another user"], ans:1, exp:"Activation is the step between signup and becoming a retained user — it is the 'aha moment' where the user gets the product's value. For Spotify, it might be 'listened to 30 minutes of music in first session'. Improving activation directly improves Day-7 retention." },
    { q:"What is the difference between a vanity metric and an actionable metric?", opts:["Vanity metrics are financial; actionable metrics are operational","Vanity metrics look good but don't tell you what to do; actionable metrics are tied to a specific decision or lever","Vanity metrics are tracked daily; actionable metrics are tracked monthly","There is no difference — all metrics have value"], ans:1, exp:"Total signups looks impressive but doesn't tell you what to change. Week-1 activation rate tells you exactly where to look (the first-week experience) and what to test (onboarding changes). Actionable metrics drive decisions; vanity metrics drive ego." },
    { q:"An A/B test shows variant B has +5% conversion, p=0.03. What is a complete evaluation before shipping?", opts:["Ship immediately — p<0.05 confirms it is better","Check effect size, whether the test ran long enough (full week cycle), if guardrail metrics degraded, and whether the lift is practically significant","Run the test for one more week to be sure","Reject the result — practical significance requires p<0.01"], ans:1, exp:"A complete A/B read: 1) Is p-value significant? 2) Is the absolute effect size meaningful for the business cost of shipping? 3) Did the test run long enough to capture weekly seasonality and avoid novelty bias? 4) Did retention, revenue per user, or support volume worsen?" },
    { q:"What is a funnel analysis?", opts:["A chart of revenue over time","A step-by-step breakdown of user progression through a sequence of actions, identifying where users drop off","A comparison of two user segments","An analysis of the sales pipeline"], ans:1, exp:"Funnel analysis tracks how many users complete each step of a sequential flow (e.g. Homepage → Product Page → Add to Cart → Checkout → Purchase). The drop-off between steps reveals where friction is highest and where to focus product investment." },
    { q:"What does a flat retention curve indicate about a product?", opts:["The product has no retained users","Users churn completely eventually — no one stays","A stable base of users who find long-term value — the hallmark of product-market fit","Retention data is missing"], ans:2, exp:"All retention curves drop initially. A curve that flattens and stabilises above 0% means a cohort of users find lasting value — they become the retained core. A curve that drops to 0% means the product has no long-term value for any user segment." },
    { q:"What is the difference between revenue and bookings?", opts:["They are identical","Bookings are contracts signed (cash committed); revenue is recognised over the service period per accounting rules (especially in SaaS)","Revenue is always higher than bookings","Bookings measure customer satisfaction; revenue measures cash"], ans:1, exp:"Bookings = total contract value when a customer commits. Revenue = the portion recognised based on delivery (for a 12-month SaaS contract, 1/12 is recognised per month). A company can have high bookings but low recognised revenue if the contracts are long-term." },
    { q:"What does NPS (Net Promoter Score) measure and what are its limitations?", opts:["Average customer spend per session","The likelihood of customers recommending the product; limitations: single-question, lagging, can't diagnose root cause","Customer satisfaction with a specific feature","Time spent in the product"], ans:1, exp:"NPS asks 'how likely are you to recommend us?' on a 0-10 scale. Promoters (9-10) minus Detractors (0-6) = NPS. Limitations: it's a lagging indicator, varies by industry baseline, and doesn't tell you WHY users feel the way they do — always pair with qualitative follow-up." },
    { q:"How does cohort analysis differ from a snapshot metric like this-month's retention?", opts:["They are the same calculation presented differently","A snapshot mixes users at different lifecycle stages; cohort analysis isolates groups by start date to see how specific cohorts behave over time","Snapshot metrics are more accurate","Cohort analysis only works for apps, not websites"], ans:1, exp:"A snapshot metric (this-month's retention) blends users who signed up 1 month ago with users who signed up 2 years ago — hiding lifecycle effects. Cohort analysis groups by signup date and tracks each cohort independently, revealing whether new or old users are causing a retention shift." },
    { q:"What is product-market fit (PMF) and how would you measure it with data?", opts:["PMF means the product is profitable","PMF means the product strongly satisfies a significant market need — measurable by retention curve stabilisation, high NPS, strong DAU/MAU, and low churn in the core user segment","PMF means the product has 1 million users","PMF is a qualitative concept — it cannot be measured with data"], ans:1, exp:"PMF signals: retention curves that flatten and stabilise (users who stay, stay), a DAU/MAU ratio that reflects natural usage frequency, high NPS from a core segment, and organic word-of-mouth driving acquisition. Sean Ellis's survey ('how disappointed if this product disappeared?') >40% 'very disappointed' is another proxy." },
    { q:"What is the difference between acquisition and activation in the AARRR framework?", opts:["They are the same step","Acquisition = users arrive (downloads, signups); Activation = users first experience real value (the aha moment)","Acquisition = first purchase; Activation = repeat purchase","Acquisition is for B2B; Activation is for B2C"], ans:1, exp:"AARRR (Acquisition, Activation, Retention, Referral, Revenue). Acquisition gets users through the door; Activation gets them to experience why they should stay. The gap between these two is often the biggest opportunity in early-stage products." },
    { q:"Session duration dropped 15% after a UI redesign. Is this necessarily bad?", opts:["Yes — lower session duration always means worse engagement","Not necessarily — if users find what they need faster, shorter sessions could indicate better UX and efficiency","Yes — users must be confused by the new design","No — session duration is always a vanity metric"], ans:1, exp:"Context matters. For a content platform (YouTube, Netflix), lower session duration is bad. For a task-completion product (banking, food delivery), lower session duration might mean the redesign made tasks faster — a positive. Always pair session duration with task completion rate and retention." },
    { q:"What is customer segmentation and why does it matter for analysis?", opts:["Splitting revenue by product category","Grouping users by shared characteristics (behaviour, demographics, value) to tailor analysis, messaging, and product decisions to each group's distinct needs","Ranking customers by lifetime value only","Filtering customers by acquisition date"], ans:1, exp:"Segmentation reveals that aggregate metrics hide very different sub-populations. A flat overall retention might hide excellent retention in the power-user segment and terrible retention in the casual segment — requiring very different interventions for each." },
    { q:"What does MAU growth of 20% with revenue growth of 5% suggest?", opts:["The product is very efficient","User growth is outpacing monetisation — the product may be acquiring lower-value users or not converting growth to revenue effectively","The product is in decline","Revenue always lags MAU growth by a fixed amount"], ans:1, exp:"Diverging growth rates between users and revenue (MAU up 20%, revenue up only 5%) often signals: lower-ARPU cohorts being acquired, monetisation features not scaling, or a freemium model where more users convert to free than paid. It warrants a segment-level revenue decomposition." },
    { q:"How would you define and measure a 'power user' for a product analytics interview?", opts:["A user who has been on the platform the longest","A user in the top X% by a value metric relevant to the product (e.g. top 10% by sessions per week, orders per month, or content created)","A user who has referred at least one other user","A user who has never churned"], ans:1, exp:"Power users are typically defined by engagement intensity relative to the product's core action — top 10% by sessions for a social app, top 10% by orders for a marketplace. Identifying them lets you study what differentiates them, then design features or flows to move more users toward those behaviours." },
  ]},
  { topic:"Case Study Practice", questions:[
    { q:"Checkout conversion dropped 12% this week. What is your FIRST segmentation cut?", opts:["By customer age group","By platform (iOS vs Android vs Web) to isolate a potential release regression","By product category","By marketing channel"], ans:1, exp:"Platform is the first cut because it isolates the most common and fastest-to-fix root cause — a release-specific bug. If the drop is concentrated on one platform version, you likely need to rollback. Geography is second, channel is third." },
    { q:"An A/B test shows B has +5% conversion, p=0.03. What additional checks before shipping?", opts:["Ship immediately","Check effect size, test duration (full weekly cycle), guardrail metrics (retention, revenue/user, support tickets), and novelty bias","Run for one more week regardless","Reject — need p<0.01"], ans:1, exp:"p=0.03 clears significance but is only one check. Also: Is the absolute lift worth the engineering cost? Did the test run >1 week to capture seasonality? Did any guardrail metric worsen? A complete A/B read considers all three." },
    { q:"You are building a dashboard for the VP of Product. What is your FIRST step?", opts:["Start building in Power BI immediately","Identify which decisions this dashboard needs to drive and who the primary user is","Copy an existing template","Add every metric you can think of"], ans:1, exp:"A dashboard without a clear decision it enables is decoration. The first question: what actions should a viewer take based on what they see? This determines which metrics matter, what grain to use, and critically — what to leave out." },
    { q:"Feature adoption is 8% vs a 25% target. What do you check first before recommending fixes?", opts:["Launch a push notification campaign","Confirm adopters retain better than non-adopters — prove the feature drives value before investing in adoption","Redesign the feature","Remove the feature"], ans:1, exp:"If adopters don't retain better, pushing more users to the feature won't help the business — you'd just optimise a vanity metric. First prove the feature drives the outcome you care about, then investigate why adoption is low." },
    { q:"DAU dropped 20%, revenue is flat. What is the most likely root cause?", opts:["A major product bug affecting all users","A tracking or logging failure undercounting active users","Seasonal effect","A competitor launched"], ans:1, exp:"A 20% DAU drop with flat revenue is almost always a tracking problem — real user loss at that scale would appear in revenue. Mismatched signals across metrics is the clearest sign of a data quality issue, not a product issue." },
    { q:"Retention dropped 8% in two weeks. Walk me through the first 3 steps of your diagnosis.", opts:["Immediately rollback the last release, then segment, then write a report","Clarify the metric definition, then rule out a tracking change, then plot the daily trend to distinguish a cliff from a gradual decline","Send a user survey, then analyse responses, then update the product","Check competitor pricing, then check ad spend, then check app store reviews"], ans:1, exp:"Step 1: Clarify — D1/D7/D30? Relative or absolute? Step 2: Quantify — is it real (not a tracking artifact)? Step 3: Plot daily — cliff (event-driven: release/outage) vs gradual (market/seasonal). Only after these do you segment." },
    { q:"You find the retention drop is entirely on Android users running app version 4.7.2. What do you do?", opts:["Run a full root cause analysis across all platforms","Flag this to engineering as a likely release regression requiring a hotfix or rollback — you have already localised the cause","Survey Android users","Check if Android MAU also dropped"], ans:1, exp:"When a metric drop is 100% concentrated in one segment (platform + version), you have localised the cause to that release. The correct action is to immediately flag to engineering — a rollback or hotfix is the intervention, not more analysis." },
    { q:"A PM asks: 'Is our new recommendation engine working?' What data would you pull first?", opts:["Revenue since the feature launched","Click-through rate on recommendations, conversion rate for recommended items, and retention of users who engaged with recommendations vs those who didn't","Number of recommendations shown per session","App store rating changes since launch"], ans:1, exp:"You need to measure the feature's mechanism (CTR on recommendations), its conversion impact (recommended item purchase rate), and whether it drives long-term retention (the true value test). Comparing engaged vs non-engaged users gives a directional signal even without a clean A/B test." },
    { q:"Revenue is up 15% but new user signups are flat. What is the most likely explanation?", opts:["Data error — both metrics should move together","Existing users are spending more (higher ARPU/expansion revenue) or a pricing change drove higher revenue per user without new acquisition growth","Seasonality is affecting only revenue","Marketing campaigns are failing"], ans:1, exp:"Revenue and signup growth diverging usually means one of: existing users upgrading/buying more (expansion revenue), a price increase, improved conversion of existing users, or reduced discounting. This is often healthy — monetising existing users better than chasing new ones." },
    { q:"A product metric moves from 42% to 38% month-over-month. A PM says 'retention is down'. How do you respond?", opts:["Agree — any drop in retention is bad","Ask: Is this statistically significant given sample size? Is this within normal variation? Has the metric definition or measurement changed? And which user segment drove the drop?","Immediately recommend product changes","Run an A/B test to confirm"], ans:1, exp:"A 4-point change needs context: is it statistically significant on the sample size available? Is 4 points within historical variance (seasonality, noise)? Has measurement changed? And has it changed for all users or just a segment? Jumping to conclusions on a raw number is a common analyst mistake." },
    { q:"How would you measure whether a new onboarding flow is better than the old one?", opts:["Compare total signups before and after the launch","Compare D7 retention, activation rate (completion of core action in first session), and time-to-first-value between users exposed to old vs new flow — ideally via an A/B test","Ask users which they prefer via a survey","Check app store reviews after launch"], ans:1, exp:"Onboarding quality is best measured by outcomes it drives: D7 retention (did more users stick around?), activation rate (did more users complete the core action?), and time-to-value (did they get there faster?). An A/B test isolates the causal impact from external factors." },
    { q:"You are asked to prioritise 5 potential features. How would you use data to make the recommendation?", opts:["Choose the feature your most vocal users request most","Size each feature by potential impact (affected users × expected metric lift) and effort, verify assumptions with current data, and check if comparable features drove the expected metric in the past","Build all 5 features and see which one performs best","Pick the cheapest feature to build first"], ans:1, exp:"A data-driven prioritisation framework: 1) Size the opportunity (how many users affected?), 2) Estimate the lift per user on the North Star metric, 3) Validate the assumption (does current data support the hypothesis?), 4) Benchmark effort vs expected impact. This is more rigorous than voting or gut feel." },
    { q:"A city manager at a food delivery company says 'order volume dropped in Pune this week'. How do you investigate?", opts:["Assume it is a product bug and rollback the last release","Check weather, local events, competitor promotions, then segment by restaurant category and order time to isolate the pattern before diagnosing the cause","Send a discount coupon to Pune users","Compare Pune to Bengaluru and assume the difference explains it"], ans:1, exp:"A geo-specific drop usually has a non-product cause first: bad weather, local event (exam season, holiday), a competitor promotion. Check these before assuming a product issue. Then segment by time of day, restaurant type, and device to isolate the pattern." },
    { q:"How would you measure the success of a new search feature on an e-commerce platform?", opts:["Count the number of searches performed per day","Measure: search-to-click rate, search-to-purchase conversion, zero-result rate, query reformulation rate, and retention of users who search vs those who don't","Compare total revenue before and after launch","Monitor page load time of the search results page"], ans:1, exp:"Search quality metrics: search-to-click (are results relevant?), search-to-purchase (do relevant results convert?), zero-result rate (are queries failing entirely?), query reformulation (are users rephrasing because results were bad?). Retention difference between searchers and non-searchers tests the feature's long-term value." },
    { q:"'Our power users are churning at the same rate as casual users.' Why is this alarming?", opts:["Power users churning is normal and expected","Power users typically have higher switching costs and stronger habits — if they are churning at the same rate as casual users, something fundamental (pricing, competition, product quality) may be affecting the core value proposition","Power users always churn faster because they exhaust the product","Casual users always churn faster, so this is good news"], ans:1, exp:"Power users have the most invested in the product — they've built habits, workflows, and connections. If they churn at the same rate as casual users, the switching cost is apparently low enough or the problem is serious enough that even deeply engaged users leave. This is a red alert for product-market fit." },
    { q:"A stakeholder asks for 'a quick analysis of our Q3 performance'. How do you scope this before starting?", opts:["Build the most comprehensive dashboard you can think of","Clarify: what specific decisions will this analysis inform? Which metrics matter most? What time comparison (vs Q2, vs Q3 last year)? And what is the deadline?","Start with revenue and work backwards","Look at the previous Q3 analysis and update the numbers"], ans:1, exp:"'Quick analysis of Q3' is too vague to be useful. Before starting: What decision does this enable? Which metrics matter to this stakeholder? What comparison period is relevant? Is the ask a deck, a table, or a number? Scoping prevents 3 hours of work on the wrong output." },
    { q:"You discover two metrics tell contradictory stories: revenue is up but customer satisfaction scores are down. How do you present this?", opts:["Report only the positive metric (revenue) to avoid concern","Report both, explain the tension, hypothesise the mechanism (e.g. revenue up due to price increase that hurt satisfaction), and propose what additional data would clarify the relationship","Average the two metrics into a single score","Ask the PM which metric to report"], ans:1, exp:"Contradictory metrics are the most important things to surface — not hide. The analyst's job is to present the tension clearly, offer a hypothesis for why both can be true simultaneously (revenue up on price increase → satisfaction down on perceived value), and suggest the next analysis that would resolve the ambiguity." },
    { q:"How would you calculate the ROI of a marketing campaign?", opts:["Total campaign spend / total signups","(Revenue attributable to the campaign - campaign cost) / campaign cost × 100","Total impressions / campaign cost","Revenue from all users who saw an ad"], ans:1, exp:"ROI = (incremental revenue - cost) / cost × 100. The hard part is 'incremental' — revenue you would not have gotten without the campaign. This requires either an A/B holdout group (users not shown the campaign) or multi-touch attribution modelling to isolate the campaign's causal contribution." },
    { q:"A/B test results show variant B wins on conversion but loses on session duration. Which do you ship?", opts:["Ship B — conversion is always the more important metric","Do not ship either — conflicting results mean the test failed","Evaluate which metric is closer to the North Star; if conversion drives more long-term value than session duration for this product, ship B — but flag the duration drop for monitoring","Ship A — never ship a variant that loses on any metric"], ans:2, exp:"Conflicting guardrail signals require a judgment call: which metric is more downstream of the North Star? If conversion → revenue is the business goal and session duration is a proxy metric, conversion wins — but the duration drop should be monitored post-launch for late-appearing effects." },
    { q:"How would you identify which user behaviour predicts 6-month retention?", opts:["Ask users directly via a survey","Segment users who are retained at 6 months and compare their early behaviour (Day 1-7 actions) to churned users, then build a predictive model or define an activation threshold based on the differentiating behaviour","Look at which features have the most users","Track revenue from retained users only"], ans:1, exp:"This is the 'activation metric definition' analysis. Compare behaviours of 6-month retained users vs churned users in their first week — the differentiating actions (e.g. 'users who connect 3+ friends in week 1 retain at 2× the rate') become the target activation metric and early retention predictor." },
    { q:"Your analysis shows a 10% uplift in a metric after a product change. A senior stakeholder says 'correlation is not causation'. How do you respond?", opts:["Agree and withdraw the recommendation","Acknowledge the concern, explain whether the change was tested via A/B test (causal) or is observational (correlational), and if observational, propose additional controls (holdout group, difference-in-differences, time-series analysis) to strengthen the causal case","Ignore the comment — 10% uplift is significant regardless","Defend the analysis by citing the p-value"], ans:1, exp:"This is the right question to ask. If the change was measured via a properly randomised A/B test, the uplift IS causal — explain that. If it was observational (before/after), acknowledge the limitation and propose how to strengthen the causal claim: a holdout group, regression discontinuity, or difference-in-differences analysis." },
    { q:"How do you communicate a complex analysis finding to a non-technical VP in a 5-minute update?", opts:["Show every chart and methodology to demonstrate rigour","Lead with the business implication in plain English, show one or two key supporting charts, acknowledge the confidence level, and state the recommended action — offer to share the technical detail separately","Send the full analysis document and let them read it","Use as much technical jargon as possible to establish credibility"], ans:1, exp:"Executive communication: Answer first (the so-what), support with minimal evidence (1-2 charts), state confidence level honestly, recommend a clear action. The analysis depth lives in an appendix or follow-up. The skill is knowing what to include vs. leave out — and always leading with 'so what does this mean for us?'" },
    { q:"User session count is up but conversion is down. What is a likely explanation?", opts:["The data is wrong — sessions and conversion always move together","A lower-quality acquisition channel is bringing in high volume but low-intent users who browse but don't buy","The product has a bug on the checkout page only","Seasonal patterns are affecting both metrics"], ans:1, exp:"Volume up + conversion down is a classic acquisition quality problem. More sessions from a broad/untargeted campaign bring users who are browsing but not intending to buy. Segment by acquisition channel — if one channel has dramatically lower conversion than others, that's the culprit." },
    { q:"How would you define success metrics for a new social sharing feature?", opts:["Count how many times the share button is clicked","Measure: share rate (% of users who share), viral coefficient (new users acquired per share), retention difference between users who share vs those who don't, and content quality signals (shares that lead to signups)","Track total posts created","Monitor page load speed of the share flow"], ans:1, exp:"Share feature success requires measuring the mechanism (share rate), the business impact (viral coefficient: does sharing bring in new users?), and whether sharing drives long-term value (do sharers retain better?). A feature with high share rate but zero downstream impact is only a vanity metric." },
    { q:"A product experiment ran for 4 weeks and showed no significant effect. The PM wants to keep testing. What do you advise?", opts:["Keep running — more time always improves significance","Calculate the minimum detectable effect for the current sample size. If the true effect would be too small to matter for the business even if detected, call it a null result and move on. If the MDE is still meaningful, discuss whether more power (larger sample) could help","Stop all experimentation on this feature","Lower the significance threshold to p<0.10"], ans:1, exp:"A null result after 4 weeks deserves a proper power analysis. If the MDE (smallest effect the test could detect) is already below business significance, more time won't help — the feature genuinely doesn't move the needle at a meaningful level. Knowing what does NOT work is also a valid, valuable outcome." },
  ]},
];

let quizState = {
  topic: 0, questions: [], current: 0, score: 0,
  answered: false, done: false, shuffled: []
};

function shuffleArr(arr){ return arr.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v); }

function quizStart(topicIdx){
  const bank = QUIZ_BANK[topicIdx];
  // Pick 15 random questions
  const picked = shuffleArr(bank.questions).slice(0, Math.min(15, bank.questions.length));
  // For each question, shuffle the answer options and track where the correct answer moved
  const questions = picked.map(q => {
    const indexed = q.opts.map((text, i) => ({ text, origIdx: i }));
    const shuffled = shuffleArr(indexed);
    const newAns = shuffled.findIndex(o => o.origIdx === q.ans);
    return { q: q.q, exp: q.exp, opts: shuffled.map(o => o.text), ans: newAns };
  });
  quizState = { topic: topicIdx, questions, current: 0, score: 0, answered: false, done: false };
  renderQuiz();
}

function renderQuiz(){
  const el = document.getElementById('quizView');
  el.innerHTML = "";

  /* topic nav */
  const nav = document.createElement('div'); nav.className="quiz-topic-nav";
  QUIZ_BANK.forEach((t,i)=>{
    const b = document.createElement('button');
    b.textContent = t.topic;
    b.className = quizState.topic===i ? "active" : "";
    b.onclick = ()=> quizStart(i);
    nav.appendChild(b);
  });
  el.appendChild(nav);

  if(quizState.done){ renderQuizScore(el); return; }

  const q = quizState.questions[quizState.current];
  const total = quizState.questions.length;

  /* progress bar */
  const prog = document.createElement('div'); prog.className="quiz-progress";
  const bar = document.createElement('div'); bar.className="quiz-progress-bar";
  bar.style.width = ((quizState.current/total)*100)+'%';
  prog.appendChild(bar); el.appendChild(prog);

  /* header */
  const hdr = document.createElement('div'); hdr.className="quiz-header";
  const h3 = document.createElement('h3'); h3.textContent = QUIZ_BANK[quizState.topic].topic;
  const meta = document.createElement('div'); meta.className="quiz-meta";
  meta.textContent = `Q${quizState.current+1} of ${total} · Score: ${quizState.score}`;
  hdr.appendChild(h3); hdr.appendChild(meta); el.appendChild(hdr);

  /* card */
  const card = document.createElement('div'); card.className="quiz-card";
  const qnum = document.createElement('div'); qnum.className="quiz-q-num";
  qnum.textContent = `Question ${quizState.current+1} of ${total}`;
  const qtext = document.createElement('div'); qtext.className="quiz-q-text"; qtext.textContent = q.q;
  card.appendChild(qnum); card.appendChild(qtext);

  const optsEl = document.createElement('div'); optsEl.className="quiz-options";
  const keys = ['A','B','C','D'];
  q.opts.forEach((opt, i)=>{
    const row = document.createElement('div'); row.className="quiz-opt";
    row.dataset.idx = i;
    const key = document.createElement('span'); key.className="quiz-opt-key"; key.textContent=keys[i];
    const txt = document.createElement('span'); txt.textContent=opt;
    row.appendChild(key); row.appendChild(txt);
    if(!quizState.answered){
      row.onclick = ()=> handleAnswer(i);
    } else {
      if(i===q.ans) row.classList.add('reveal-correct');
      if(i===quizState.lastPicked && i!==q.ans) row.classList.add('wrong');
      if(i===quizState.lastPicked && i===q.ans) row.classList.add('correct');
    }
    optsEl.appendChild(row);
  });
  card.appendChild(optsEl);

  /* feedback */
  const fb = document.createElement('div'); fb.className="quiz-feedback";
  if(quizState.answered){
    fb.classList.add('show');
    fb.innerHTML = `<strong>${quizState.lastCorrect ? '✅ Correct!' : '❌ Not quite.'}</strong> ${q.exp}`;
    fb.classList.add(quizState.lastCorrect ? 'ok' : 'bad');
  }
  card.appendChild(fb);
  el.appendChild(card);

  /* next button */
  const nextBtn = document.createElement('button'); nextBtn.className="quiz-next";
  if(quizState.answered) nextBtn.classList.add('show');
  nextBtn.textContent = quizState.current+1 < total ? "Next Question →" : "See Results";
  nextBtn.onclick = ()=>{
    quizState.current++;
    quizState.answered = false;
    if(quizState.current >= total){ quizState.done=true; }
    renderQuiz();
  };
  el.appendChild(nextBtn);
}

function handleAnswer(idx){
  if(quizState.answered) return;
  const q = quizState.questions[quizState.current];
  const correct = idx === q.ans;
  if(correct) quizState.score++;
  quizState.answered = true;
  quizState.lastCorrect = correct;
  quizState.lastPicked = idx;

  /* colour the options immediately without re-rendering */
  document.querySelectorAll('.quiz-opt').forEach((el, i)=>{
    el.style.cursor = 'default';
    el.onclick = null;
    if(i === idx && correct)  el.classList.add('correct');
    if(i === idx && !correct) el.classList.add('wrong');
    if(i === q.ans && !correct) el.classList.add('reveal-correct');
  });
  const fb = document.querySelector('.quiz-feedback');
  fb.classList.add('show', correct ? 'ok' : 'bad');
  fb.innerHTML = `<strong>${correct ? '✅ Correct!' : '❌ Not quite.'}</strong> ${q.exp}`;
  document.querySelector('.quiz-next').classList.add('show');
}

function renderQuizScore(el){
  const total = quizState.questions.length;
  const pct = Math.round((quizState.score/total)*100);
  const msg = pct===100 ? "Perfect score — flawless! 🏆"
    : pct>=80 ? "Strong result — you're interview-ready on this topic! 💪"
    : pct>=60 ? "Good effort — review the explanations above and retry."
    : "Keep at it — revisit Theory & Prep tabs, then come back.";
  const breakdown = QUIZ_BANK.map((t,i)=> `<span style="margin-right:10px;cursor:pointer;color:var(--accent);text-decoration:underline;" onclick="quizStart(${i})">${t.topic}</span>`).join('');
  const panel = document.createElement('div'); panel.className="quiz-score-panel";
  panel.innerHTML = `
    <div class="quiz-score-big">${quizState.score}/${total}</div>
    <div class="quiz-score-label">${pct}% correct · ${total} questions · answers & order shuffled each run</div>
    <div class="quiz-score-msg">${msg}</div>
    <button class="quiz-restart" onclick="quizStart(${quizState.topic})">🔁 Retry This Topic</button>
    <div style="margin-top:16px;font-size:12px;color:var(--sub);">Or jump to:</div>
    <div style="margin-top:6px;font-size:13px;">${breakdown}</div>
  `;
  el.appendChild(panel);
}

function initQuiz(){
  if(!document.getElementById('quizView').dataset.built){
    document.getElementById('quizView').dataset.built="1";
    quizStart(0);
  }
}
