<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>45-Day QA → DA Tracker</title>
<style>
:root{
  --bg:#f6f5f3; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b; --line:#e6e4e0;
  --accent:#2f6f4f; --accent-soft:#e6f0ea; --amber:#b8862c; --done:#2f6f4f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --card:#201f1c; --ink:#ece9e4; --sub:#a3a099; --line:#37342e;
    --accent:#6fbf94; --accent-soft:#1f3229; --amber:#e0b25c; --done:#6fbf94;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --card:#201f1c; --ink:#ece9e4; --sub:#a3a099; --line:#37342e;
  --accent:#6fbf94; --accent-soft:#1f3229; --amber:#e0b25c; --done:#6fbf94;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 60px;}
header{padding:8px 0 20px;}
h1{font-size:22px; margin:0 0 4px; letter-spacing:-0.01em;}
.tag{color:var(--sub); font-size:13px;}

.panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
.progress-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.ring{position:relative; width:72px; height:72px; flex:none;}
.ring svg{transform:rotate(-90deg); width:72px; height:72px;}
.ring circle{fill:none; stroke-width:7;}
.ring .bg{stroke:var(--line);}
.ring .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .3s;}
.ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600;}
.stats{flex:1; min-width:180px; display:flex; gap:18px; flex-wrap:wrap;}
.stat b{display:block; font-size:20px;}
.stat span{font-size:12px; color:var(--sub);}

.startdate{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--sub); margin-top:12px; flex-wrap:wrap;}
.startdate input{border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:5px 8px; font-size:13px;}

.phase-nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
.phase-nav button{
  flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:7px 12px; border-radius:999px; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.phase-nav button.active{background:var(--accent); border-color:var(--accent); color:#fff;}

.phase-block{margin-bottom:26px;}
.phase-title{font-size:15px; font-weight:700; margin:0 0 2px;}
.phase-sub{font-size:12.5px; color:var(--sub); margin:0 0 10px;}

.day{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
.day.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.day.complete{border-color:var(--done);}
.day-head{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;}
.day-num{
  flex:none; width:34px; height:34px; border-radius:10px; background:var(--bg); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; color:var(--sub);
}
.day.complete .day-num{background:var(--accent-soft); color:var(--done); border-color:var(--done);}
.day.today .day-num{background:var(--accent); color:#fff; border-color:var(--accent);}
.day-info{flex:1; min-width:0;}
.day-title{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.day-meta{font-size:11.5px; color:var(--sub);}
.chev{flex:none; color:var(--sub); font-size:12px; transition:transform .15s;}
.day.open .chev{transform:rotate(90deg);}
.day-body{display:none; padding:0 14px 14px;}
.day.open .day-body{display:block;}
.day-focus{font-size:13px; line-height:1.55; color:var(--sub); margin:0 0 10px; padding-bottom:10px; border-bottom:1px solid var(--line);}
.task{display:flex; align-items:flex-start; gap:9px; padding:6px 0; font-size:13.5px;}
.task input[type=checkbox]{margin-top:3px; width:16px; height:16px; accent-color:var(--accent); flex:none;}
.task label.done{color:var(--sub); text-decoration:line-through;}
.notes{width:100%; margin-top:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
  border-radius:8px; padding:8px; font-size:13px; font-family:inherit; resize:vertical; min-height:40px;}
.notes::placeholder{color:var(--sub);}

.toast{
  position:fixed; bottom:calc(18px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:12.5px;
  opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; z-index:50;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.reset-row{text-align:center; margin-top:18px;}
.reset-row button{background:none; border:none; color:var(--sub); font-size:12px; text-decoration:underline; cursor:pointer;}

.view-toggle{display:flex; gap:6px; margin-bottom:16px;}
.view-toggle button{
  flex:1 1 auto; min-width:88px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 8px; border-radius:10px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.view-toggle button.active{background:var(--accent); border-color:var(--accent); color:#fff;}

.prep-block{margin-bottom:22px;}
.prep-title{font-size:15px; font-weight:700; margin:0 0 10px;}
.ref{background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
.ref-head{display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;}
.ref-head .chev{margin-left:auto;}
.ref-name{font-size:13.5px; font-weight:600;}
.ref-body{display:none; padding:0 14px 14px;}
.ref.open .ref-body{display:block;}
.ref.open .chev{transform:rotate(90deg);}
.why{font-size:13px; color:var(--sub); margin:8px 0 10px; line-height:1.5;}
pre{
  background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  overflow-x:auto; font-size:12px; line-height:1.5; margin:0 0 8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
code{font-family:inherit;}
.fw{font-size:13px; line-height:1.6; margin:0 0 8px;}
.fw b{color:var(--ink);}
.qa-a{font-size:13px; line-height:1.6; color:var(--ink); margin:0;}
.qa-tag{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--amber);
  background:var(--accent-soft); padding:2px 7px; border-radius:6px; margin-bottom:8px;}

.cheat-section{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
.cheat-section h3{font-size:14px; margin:0 0 10px;}
.cheat-row{padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
.cheat-row:last-child{border-bottom:none;}
.cheat-code{display:block; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--accent); white-space:pre-wrap; word-break:break-word; margin-bottom:2px;}
.cheat-desc{color:var(--sub);}

.card-wrap{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 18px; min-height:180px;
  display:flex; flex-direction:column; justify-content:center; margin-bottom:14px;}
.card-tag{font-size:10.5px; font-weight:700; letter-spacing:.03em; color:var(--amber); margin-bottom:10px;}
.card-q{font-size:16px; font-weight:600; line-height:1.4;}
.card-a{font-size:14px; line-height:1.6; color:var(--sub); margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:none;}
.card-a.shown{display:block;}
.card-controls{display:flex; gap:8px; align-items:center; justify-content:space-between;}
.card-controls button{border:1px solid var(--line); background:var(--card); color:var(--ink); padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;}
.card-controls button.primary{background:var(--accent); border-color:var(--accent); color:#fff; flex:1;}
.card-counter{font-size:12px; color:var(--sub); text-align:center; margin-bottom:10px;}

/* Quiz styles */
.quiz-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.quiz-header h3{margin:0; font-size:15px;}
.quiz-meta{font-size:12px; color:var(--sub);}
.quiz-topic-nav{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
.quiz-topic-nav button{flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; white-space:nowrap;}
.quiz-topic-nav button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.quiz-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:14px;}
.quiz-q-num{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--sub); text-transform:uppercase; margin-bottom:8px;}
.quiz-q-text{font-size:15px; font-weight:600; line-height:1.45; margin-bottom:16px;}
.quiz-options{display:flex; flex-direction:column; gap:8px;}
.quiz-opt{display:flex; align-items:flex-start; gap:10px; background:var(--bg); border:1.5px solid var(--line);
  border-radius:10px; padding:11px 14px; cursor:pointer; font-size:13.5px; line-height:1.4; transition:border-color .15s, background .15s;}
.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.quiz-opt.correct{border-color:#2f6f4f; background:#e6f0ea;}
.quiz-opt.wrong{border-color:#c0392b; background:#fdecea;}
.quiz-opt.reveal-correct{border-color:#2f6f4f; background:#e6f0ea; opacity:.8;}
@media (prefers-color-scheme:dark){
  .quiz-opt.correct{background:#1a3326;}
  .quiz-opt.wrong{background:#3b1a1a;}
  .quiz-opt.reveal-correct{background:#1a3326;}
}
:root[data-theme="dark"] .quiz-opt.correct{background:#1a3326;}
:root[data-theme="dark"] .quiz-opt.wrong{background:#3b1a1a;}
:root[data-theme="dark"] .quiz-opt.reveal-correct{background:#1a3326;}
.quiz-opt-key{font-weight:700; color:var(--sub); flex:none; width:18px;}
.quiz-feedback{margin-top:12px; padding:10px 12px; border-radius:8px; font-size:13px; line-height:1.5; display:none;}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:var(--accent-soft); color:var(--done);}
.quiz-feedback.bad{background:#fdecea; color:#c0392b;}
@media (prefers-color-scheme:dark){.quiz-feedback.bad{background:#3b1a1a; color:#e07070;}}
:root[data-theme="dark"] .quiz-feedback.bad{background:#3b1a1a; color:#e07070;}
.quiz-actions{display:flex; gap:8px; align-items:center; margin-top:14px;}
.quiz-next{background:var(--accent); border:none; color:#fff; padding:10px 20px; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer; display:none;}
.quiz-next.show{display:block;}
.quiz-score-panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; text-align:center; margin-bottom:14px;}
.quiz-score-big{font-size:48px; font-weight:800; color:var(--accent); line-height:1;}
.quiz-score-label{font-size:14px; color:var(--sub); margin-top:6px;}
.quiz-score-msg{font-size:15px; font-weight:600; margin:14px 0 6px;}
.quiz-restart{background:var(--accent); border:none; color:#fff; padding:11px 24px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; margin-top:12px;}

/* Shared AI panel styles */
.ai-panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
.ai-panel h3{font-size:14px; font-weight:700; margin:0 0 8px;}
.ai-hint{font-size:12px; color:var(--sub); margin-bottom:10px; line-height:1.5;}
.ai-textarea{width:100%; min-height:100px; background:var(--bg); color:var(--ink); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; font-family:inherit; font-size:13px; line-height:1.5; resize:vertical;}
.ai-btn{background:var(--accent); border:none; color:#fff; padding:10px 18px; border-radius:10px;
  font-size:13.5px; font-weight:700; cursor:pointer; margin-top:8px;}
.ai-btn:disabled{opacity:.5; cursor:default;}
.ai-output{background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px;
  font-size:13px; line-height:1.65; margin-top:10px; white-space:pre-wrap; display:none; min-height:40px;}
.ai-output.show{display:block;}
.ai-spinner{font-size:12px; color:var(--sub); margin-top:6px; display:none;}
.ai-spinner.show{display:block;}

/* Mock interview */
.mock-type-nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.mock-type-nav button{border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:6px 12px; border-radius:999px; font-size:12px; cursor:pointer; white-space:nowrap;}
.mock-type-nav button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.mock-q-card{background:var(--accent-soft); border:1px solid var(--accent); border-radius:12px; padding:14px; margin-bottom:10px;}
.mock-q-label{font-size:10.5px; font-weight:700; color:var(--accent); letter-spacing:.05em; margin-bottom:6px;}
.mock-q-text{font-size:15px; font-weight:600; line-height:1.4;}
.score-pill{display:inline-block; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:700; margin-bottom:8px;}
.score-high{background:#e6f0ea; color:#2f6f4f;}
.score-mid{background:#fff8e1; color:#b8862c;}
.score-low{background:#fdecea; color:#c0392b;}

/* STAR builder */
.star-tabs{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
.star-tabs button{flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;}
.star-tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.star-panel{display:none;}
.star-panel.active{display:block;}
.star-section{margin-bottom:12px;}
.star-section label{display:block; font-size:12px; font-weight:700; color:var(--sub); letter-spacing:.04em; margin-bottom:4px; text-transform:uppercase;}

/* Company cards */
.company-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:12px; margin-bottom:12px;}
.company-card{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.company-head{padding:12px 14px; cursor:pointer; display:flex; align-items:center; gap:10px;}
.company-logo{width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  font-size:16px; flex:none; font-weight:700; color:#fff;}
.company-name{font-size:14px; font-weight:700;}
.company-type{font-size:11px; color:var(--sub);}
.company-body{display:none; padding:0 14px 14px; border-top:1px solid var(--line);}
.company-card.open .company-body{display:block;}
.company-card.open .chev{transform:rotate(90deg);}
.company-body ul{margin:8px 0 0; padding-left:16px; font-size:13px; line-height:1.7; color:var(--sub);}
.company-body li b{color:var(--ink);}

/* Heatmap */
.heatmap-wrap{overflow-x:auto;}
.heatmap-grid{display:flex; gap:3px; padding-bottom:4px;}
.heatmap-col{display:flex; flex-direction:column; gap:3px;}
.hm-cell{width:14px; height:14px; border-radius:3px; background:var(--line); cursor:default;}
.hm-cell.l1{background:#c6e6d4;}
.hm-cell.l2{background:#6fbf94;}
.hm-cell.l3{background:#2f6f4f;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .hm-cell.l1{background:#1a3326;}
  :root:not([data-theme="light"]) .hm-cell.l2{background:#2d6b52;}
  :root:not([data-theme="light"]) .hm-cell.l3{background:#6fbf94;}
}
.hm-month-labels{display:flex; gap:3px; margin-bottom:4px; font-size:10px; color:var(--sub); padding-left:18px;}
.hm-day-labels{display:flex; flex-direction:column; gap:3px; margin-right:4px; font-size:10px; color:var(--sub); padding-top:2px;}
.heatmap-legend{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--sub); margin-top:8px;}
.hm-stat-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;}
.hm-stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px;}
.hm-stat b{display:block; font-size:20px; font-weight:700;}
.hm-stat span{font-size:12px; color:var(--sub);}
.quiz-progress{height:5px; background:var(--line); border-radius:999px; margin-bottom:16px; overflow:hidden;}
.quiz-progress-bar{height:100%; background:var(--accent); border-radius:999px; transition:width .3s;}

.editor-tabs{display:flex; gap:6px; margin-bottom:10px;}
.editor-tabs button{border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;}
.editor-tabs button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.editor-panel{display:none;}
.editor-panel.active{display:block;}
.code-textarea{width:100%; min-height:160px; background:var(--bg); color:var(--ink); border:1px solid var(--line);
  border-radius:10px; padding:12px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;
  line-height:1.5; resize:vertical;}
.editor-actions{display:flex; gap:8px; margin:10px 0; align-items:center;}
.run-btn{background:var(--accent); border:none; color:#fff; padding:10px 18px; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer;}
.run-btn:disabled{opacity:.5; cursor:default;}
.editor-status{font-size:12px; color:var(--sub);}
.output-panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:60px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; overflow-x:auto;}
.output-panel table{border-collapse:collapse; width:100%; font-size:12px;}
.output-panel th, .output-panel td{border:1px solid var(--line); padding:5px 8px; text-align:left; white-space:nowrap;}
.output-panel th{background:var(--accent-soft); color:var(--ink);}
.output-error{color:#c0492f; white-space:pre-wrap;}
.output-pre{white-space:pre-wrap; margin:0;}
.schema-hint{font-size:11.5px; color:var(--sub); margin-bottom:10px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>45-Day QA → Data Analyst Tracker</h1>
    <div class="tag">SQL · Power BI/DAX · Python · Product Case Studies · CV</div>
  </header>

  <div class="panel">
    <div class="progress-row">
      <div class="ring">
        <svg viewBox="0 0 72 72">
          <circle class="bg" cx="36" cy="36" r="30"></circle>
          <circle class="fg" id="ringFg" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"></circle>
        </svg>
        <div class="pct" id="ringPct">0%</div>
      </div>
      <div class="stats">
        <div class="stat"><b id="statDaysDone">0/45</b><span>days complete</span></div>
        <div class="stat"><b id="statTasksDone">0/0</b><span>tasks done</span></div>
        <div class="stat"><b id="statStreak">0</b><span>day streak</span></div>
      </div>
    </div>
    <div class="startdate">
      Start date:
      <input type="date" id="startDateInput">
      <span id="todayLabel"></span>
    </div>
  </div>

  <div class="view-toggle" style="flex-wrap:wrap;">
    <button id="tabTracker">Tracker</button>
    <button id="tabPrep">Prep Material</button>
    <button id="tabTheory">Theory</button>
    <button id="tabCheat">Cheat Sheet</button>
    <button id="tabCards">Flashcards</button>
    <button id="tabQuiz">Quiz</button>
    <button id="tabCode">Code Editor</button>
    <button id="tabMock">Mock Interview</button>
    <button id="tabJd">JD Analyzer</button>
    <button id="tabExplain">SQL Explainer</button>
    <button id="tabStar">STAR Builder</button>
    <button id="tabCompany">Companies</button>
    <button id="tabHeatmap">Heatmap</button>
  </div>

  <div id="trackerView">
    <div class="phase-nav" id="phaseNav"></div>
    <div id="phasesContainer"></div>
    <div class="reset-row"><button id="resetBtn">Reset all progress</button></div>
  </div>

  <div id="prepView" style="display:none;"></div>
  <div id="theoryView" style="display:none;"></div>
  <div id="cheatView" style="display:none;"></div>
  <div id="cardsView" style="display:none;"></div>
  <div id="quizView" style="display:none;"></div>
  <div id="codeView" style="display:none;"></div>
  <div id="mockView" style="display:none;"></div>

function fmtDate(dt){
  return dt.toISOString().slice(0,10);
}
function currentDayNumber(){
  if(!STATE.startDate) return null;
  const start = new Date(STATE.startDate + "T00:00:00");
  const now = new Date();
  const diff = Math.floor((new Date(now.toDateString()) - new Date(start.toDateString())) / 86400000) + 1;
  if(diff < 1 || diff > 45) return null;
  return diff;
}

function computeStats(){
  let daysDone = 0, tasksDone = 0, tasksTotal = 0;
  let streak = 0, streakBroken = false;
  for(let d=1; d<=45; d++){
    const day = STATE.days[d];
    const total = day.tasks.length;
    const done = day.tasks.filter(t=>t.done).length;
    tasksTotal += total; tasksDone += done;
    const complete = total>0 && done===total;
    if(complete) daysDone++;
    if(!streakBroken){
      if(complete) streak++;
      else streakBroken = true;
    }
  }
  return { daysDone, tasksDone, tasksTotal, streak, pct: tasksTotal? Math.round(tasksDone/tasksTotal*100):0 };
}

function buildUI(){
  document.getElementById('startDateInput').value = STATE.startDate || "";
  const curDay = currentDayNumber();
  document.getElementById('todayLabel').textContent = curDay ? ("Day " + curDay + " of 45") : "";

  const stats = computeStats();
  document.getElementById('statDaysDone').textContent = stats.daysDone + "/45";
  document.getElementById('statTasksDone').textContent = stats.tasksDone + "/" + stats.tasksTotal;
  document.getElementById('statStreak').textContent = stats.streak;
  document.getElementById('ringPct').textContent = stats.pct + "%";
  const circumference = 188.5;
  const offset = circumference - (stats.pct/100)*circumference;
  document.getElementById('ringFg').style.strokeDashoffset = offset;

  const nav = document.getElementById('phaseNav');
  nav.innerHTML = "";
  const allBtn = document.createElement('button');
  allBtn.textContent = "All"; allBtn.className = activePhase==="all" ? "active":"";
  allBtn.onclick = ()=>{ activePhase="all"; renderPhases(); buildUI(); };

    b.textContent = p.label; b.className = activePhase===p.key ? "active":"";

    cb.onchange = ()=>{ t.done = cb.checked; label.className = t.done?"done":""; meta.textContent = day.tasks.filter(x=>x.done).length + "/" + total + " tasks" + (d===curDay?" · today":""); const nowComplete = day.tasks.every(x=>x.done); wrap.classList.toggle('complete', nowComplete); buildUIStatsOnly(); scheduleSave(); };
    const label = document.createElement('label'); label.className = t.done?"done":""; label.textContent = t.text;
    row.appendChild(cb); row.appendChild(label);
    body.appendChild(row);
  });
  const notes = document.createElement('textarea');
  notes.className = "notes"; notes.placeholder = "Notes for today (what tripped you up, what to revisit)...";
  notes.value = day.notes || "";
  notes.oninput = ()=>{ day.notes = notes.value; scheduleSave(); };
  body.appendChild(notes);
  wrap.appendChild(body);

  return wrap;
}

function buildUIStatsOnly(){

/* ---------- Theory Q&A content (interview-ready explanations) ---------- */
const THEORY = [
  { title:"SQL Theory", tag:"CONCEPT", qa:[
    { q:"What's the difference between WHERE and HAVING?",
      a:"WHERE filters individual rows before grouping; HAVING filters groups after GROUP BY has run. If you filter on an aggregate (SUM, COUNT), it must be HAVING, because that value doesn't exist until grouping happens." },
    { q:"Window function vs GROUP BY — when do you use which?",
      a:"GROUP BY collapses rows into one row per group and loses row-level detail. A window function (OVER PARTITION BY) computes an aggregate per group but keeps every original row intact — essential when you need both the detail and a running total, rank, or comparison to a group value (like LAG for MoM growth)." },
    { q:"Explain ROW_NUMBER vs RANK vs DENSE_RANK.",
      a:"All three number rows within a partition. ROW_NUMBER gives every row a unique, sequential number even on ties. RANK gives tied rows the same number but skips the next rank (1,1,3). DENSE_RANK gives tied rows the same number without skipping (1,1,2). Picking the wrong one on tie-heavy data silently produces a wrong 'top N'." },
    { q:"What's a CTE and why prefer it over a nested subquery?",
      a:"A CTE (WITH clause) names an intermediate result so it reads top-to-bottom like a pipeline, and — critically — each stage can be queried in isolation while debugging. Nested subqueries execute the same way but are much harder to reason about or test piece by piece." },
    { q:"Explain the types of JOINs.",
      a:"INNER: only matching rows in both tables. LEFT: all rows from the left table, matched rows from the right (NULLs where no match). RIGHT: mirror of LEFT. FULL OUTER: all rows from both, matched where possible. SELF JOIN: a table joined to itself, used for hierarchical or same-table comparisons (e.g., comparing each employee to their manager in the same table)." },
    { q:"Primary key vs foreign key vs unique key?",
      a:"Primary key uniquely identifies each row in its own table and can't be NULL. Foreign key is a column referencing another table's primary key, enforcing referential integrity. Unique key enforces uniqueness like a primary key but can allow one NULL and a table can have several." },
    { q:"What is normalization, and why would a DA care?",
      a:"Normalization removes redundancy by splitting data into related tables (reduces update anomalies) — this is how OLTP/transactional systems are built. Denormalization (star schema) intentionally reintroduces redundancy to make read/aggregation queries faster — this is how BI/reporting systems are built. Knowing which one you're querying tells you what kind of joins and performance trade-offs to expect." },
    { q:"What are ACID properties?",
      a:"Atomicity (a transaction fully succeeds or fully rolls back), Consistency (data moves between valid states only), Isolation (concurrent transactions don't interfere), Durability (once committed, it survives a crash). Worth knowing because it explains why reconciliation mismatches happen — a partial or non-isolated transaction is a common root cause." },
  ]},
  { title:"Power BI / Data Modeling Theory", tag:"CONCEPT", qa:[
    { q:"Star schema vs snowflake schema?",
      a:"Star: one fact table directly connected to flat, denormalized dimension tables — fast, simple filter propagation, DAX-friendly. Snowflake: dimensions are further normalized into sub-dimensions (e.g., DIM_Category split from DIM_Product) — saves storage but adds filter-propagation hops that can break measures unless cross-filter direction is managed carefully. Product-company interviews expect you to default to star and justify it." },
    { q:"OLTP vs OLAP?",
      a:"OLTP (Online Transaction Processing) systems — like the production database behind an app — are normalized, optimized for fast writes and single-row lookups. OLAP (Online Analytical Processing) systems — like a BI warehouse — are denormalized, optimized for large aggregate reads across millions of rows. A DA typically pulls from OLAP-style tables or builds them." },
    { q:"Explain row context vs filter context in DAX.",
      a:"Row context exists inside iterator functions (like AVERAGEX) — DAX evaluates the expression once per row, as if walking down a table. Filter context is the set of filters currently applied to a visual, slicer, or CALCULATE — it determines which rows are visible when a measure is evaluated. CALCULATE's core job is transforming row context into filter context, which is why it's the most important function in DAX." },
    { q:"What does CALCULATE actually do?",
      a:"It evaluates an expression under a modified filter context. Any filter arguments you pass (like DATEADD(...,-1,MONTH)) override or add to the existing filters from slicers/visuals for just that calculation — this is how you compute 'last month's revenue' while the visual itself is still filtered to the current month." },
    { q:"What's a Date table and why must it be marked as one?",
      a:"A dedicated table with one row per calendar date, used to drive all time-intelligence functions (DATEADD, DATESINPERIOD, SAMEPERIODLASTYEAR). Marking it as an official Date table tells Power BI's engine which column is the continuous, gap-free date axis these functions rely on — without it, time-intelligence measures return blank or wrong results even if the DAX syntax is correct." },
  ]},
  { title:"Python & Statistics Theory", tag:"CONCEPT", qa:[
    { q:"Mean vs median — when do you pick median?",
      a:"Mean is sensitive to outliers/skew; median is the middle value and robust to extreme values. For anything financial (revenue, order value, salary) that's typically right-skewed by a few large outliers, median gives a more representative 'typical' value — always justify this choice out loud." },
    { q:"IQR method vs Z-score for outlier detection?",
      a:"Z-score assumes a roughly normal (bell-curve) distribution and flags points beyond ~3 standard deviations — it breaks down on skewed data. IQR (Interquartile Range: Q3-Q1) makes no normality assumption and flags points beyond 1.5×IQR from Q1/Q3 — safer as a default for real-world business data, which is rarely normally distributed." },
    { q:"Correlation vs causation — how do you explain this in an interview?",
      a:"Correlation means two variables move together; causation means one directly produces the change in the other. A classic trap: ice cream sales and drowning deaths correlate — both are actually driven by a third variable (summer heat). In product analytics, always ask 'what confound could explain this without a causal link?' before recommending action on a correlation." },
    { q:"What are the types of missing data (MCAR, MAR, MNAR)?",
      a:"MCAR (Missing Completely At Random) — missingness is unrelated to any data; safe to drop or impute. MAR (Missing At Random) — missingness relates to other observed variables (e.g., older users skip a field); impute using those variables. MNAR (Missing Not At Random) — missingness relates to the value itself (e.g., high earners skip 'income'); dropping or naive imputation biases results. Naming which type you suspect shows statistical maturity beyond 'just fill nulls'." },
    { q:"Explain what a p-value means in an A/B test, in plain language.",
      a:"The p-value is the probability of seeing a result at least this extreme if there were truly no difference between variants (the null hypothesis is true). A small p-value (commonly <0.05) suggests the observed difference is unlikely to be random noise — but it does NOT tell you the size or business importance of the effect, only that it's probably not chance." },
    { q:"What's statistical significance vs practical significance?",
      a:"A result can be statistically significant (p<0.05, unlikely to be noise) but practically meaningless (a 0.1% conversion lift on a huge sample size). Always pair a p-value with the actual effect size and confidence interval before recommending a business decision — this is a common senior-level follow-up question." },
  ]},
  { title:"Product Metrics Theory", tag:"CONCEPT", qa:[
    { q:"Leading vs lagging indicators?",
      a:"Lagging indicators (revenue, churn) confirm what already happened — useful for reporting, too late to act on. Leading indicators (feature adoption rate, activation rate, engagement in week 1) predict what's about to happen — useful for early intervention. A strong DA answer names both and explains which one drives which decision." },
    { q:"What is a North Star Metric?",
      a:"The single metric that best captures the core value a product delivers to users, and correlates with long-term business success (e.g., Spotify: time spent listening; Airbnb: nights booked). It aligns teams around one thing instead of optimizing many disconnected metrics that can work against each other." },
    { q:"Vanity metrics vs actionable metrics?",
      a:"Vanity metrics (total signups, total downloads) look good on a slide but don't tell you what to do next. Actionable metrics (activation rate, week-1 retention, funnel conversion by step) are tied to a specific decision or intervention. Interviewers listen for whether you instinctively push back on vanity numbers." },
    { q:"DAU/WAU/MAU and stickiness ratio — what do they tell you?",
      a:"DAU/WAU/MAU = Daily/Weekly/Monthly Active Users. Stickiness = DAU/MAU, showing what fraction of monthly users engage on a typical day — a proxy for habitual use. A high MAU with low stickiness signals a product people return to occasionally, not one they depend on daily; the right target depends on the product's natural usage frequency (a daily commute app vs. an annual tax app shouldn't be judged by the same stickiness bar)." },
    { q:"Retention vs churn — how are they related, and what's a retention curve?",
      a:"Churn = % of users who stop using the product in a period; Retention = 1 - churn, the % who stay. A retention curve plots retention by days/weeks since signup — it typically drops steeply early then flattens into a 'long-term retained' plateau. The height of that plateau, more than the initial drop, is usually the more important number for product health." },
    { q:"Cohort analysis vs cross-sectional (snapshot) analysis?",
      a:"A snapshot metric (e.g., 'this month's active users') mixes users at very different lifecycle stages, hiding whether newer or older users behave differently. Cohort analysis groups users by shared start date (signup week/month) and tracks each group over time separately — this is what isolates whether a retention problem is a recent-cohort issue (points to a new-user experience bug) or affects everyone equally (points to a broader product issue)." },
  ]},
];

      body.appendChild(tag); body.appendChild(a);
      ref.appendChild(head); ref.appendChild(body);
      block.appendChild(ref);
    });
    el.appendChild(block);
  });
}

const FLASHCARDS = [
  { tag:"SQL", q:"Why would ROW_NUMBER() give a wrong 'top-2 per customer' result on tied order amounts?", a:"It assigns unique sequential ranks even to genuine ties, arbitrarily splitting equal values into rank 1 and rank 2 — fabricating a '2nd highest' that doesn't really exist. Use DENSE_RANK() so ties share a rank." },
  { tag:"SQL", q:"Why partition duplicate-detection by (user_id, amount, date) instead of by transaction_id?", a:"transaction_id is unique by definition, so grouping by it finds nothing. You must partition by the business key that actually defines 'the same event' — this is the real duplicate-detection skill." },
  { tag:"SQL", q:"What does SAFE_DIVIDE protect against, and why does it matter in a MoM growth query?", a:"It returns NULL instead of erroring when the denominator is 0 — critical for a category's first month, which has no prior-month revenue to divide against." },
  { tag:"SQL", q:"Why split a cohort retention query into 4 separate CTEs instead of one big query?", a:"Each stage (first_activity → activity_weeks → cohort_size → retained) can be checked independently with a SELECT * — this is a testable-pipeline mindset, not just a style choice." },
  { tag:"DAX", q:"Why does a DAX time-intelligence measure return blank even though the syntax is correct?", a:"The Date table almost certainly isn't marked as an official Date table — DATEADD/DATESINPERIOD rely on that flag to know which column is the continuous date axis." },
  { tag:"DAX", q:"What's the difference between row context and filter context?", a:"Row context exists inside iterators (like AVERAGEX), evaluating an expression once per row. Filter context is the set of active filters (slicers, visuals, CALCULATE) determining which rows are visible when a measure runs. CALCULATE's job is converting row context into filter context." },
  { tag:"DAX", q:"Why use AVERAGEX with DATESINPERIOD instead of a plain AVERAGE for a rolling 3-month metric?", a:"AVERAGEX re-evaluates Total Revenue for each day inside the moving window, then averages — a plain AVERAGE wouldn't respect a dynamically shifting window as the report's filter context changes." },
  { tag:"Python", q:"Why use median instead of mean to impute missing revenue values?", a:"Mean is dragged by outliers (a few very large orders); median is the robust middle value and better represents a 'typical' order in skewed business data." },
  { tag:"Python", q:"Why IQR instead of Z-score for outlier detection on order-value data?", a:"Z-score assumes a roughly normal distribution; revenue data is usually right-skewed, so IQR (based on quartiles, no normality assumption) is the safer default." },
  { tag:"Python", q:"Why fillna('Unknown') instead of dropping rows with missing categorical data?", a:"Dropping loses information you might need later (e.g. revenue attributable to unknown-segment customers). An explicit flag preserves auditability instead of silently discarding data." },
  { tag:"Stats", q:"What's the difference between statistical significance and practical significance?", a:"A result can be statistically significant (p<0.05, unlikely to be chance) but practically meaningless if the actual effect size is tiny. Always pair a p-value with effect size before recommending action." },
  { tag:"Stats", q:"Classic example of correlation without causation?", a:"Ice cream sales and drowning deaths rise together — both are driven by a third variable (summer heat), not by each other. Always ask what confound could explain a correlation before acting on it." },
  { tag:"Product", q:"Retention dropped 8% in two weeks — what's your first move?", a:"Clarify the exact metric definition first (D1/D7/D30, relative vs absolute drop), then rule out a tracking/analytics change before assuming it's a real product problem." },

  { tag:"Product", q:"Vanity metric vs actionable metric — give an example of each.", a:"Vanity: total signups — looks good, doesn't tell you what to do next. Actionable: week-1 activation rate — tied to a specific lever you can pull to move it." },
  { tag:"Modeling", q:"Why star schema over snowflake for a BI dashboard?", a:"Star schema keeps dimensions flat and denormalized, minimizing filter-propagation hops — DAX and most BI engines are optimized for exactly this. Snowflaking adds hops that can silently break measures without careful cross-filter management." },

    { q:"What does LEAD(column) OVER (...) return?", opts:["The previous row's value","The next row's value","The first row's value in the partition","The last row's value in the partition"], ans:1, exp:"LEAD() is the forward-looking counterpart of LAG(). It returns the value from the next row within the window — useful for forward-looking comparisons like 'days until next purchase'." },
