function evalExpr(expr, row){
  expr = expr.trim();
  if(/^'[^']*'$/.test(expr)) return expr.slice(1,-1);
  if(/^-?\d+(\.\d+)?$/.test(expr)) return parseFloat(expr);
  if(row && expr in row) return row[expr];
  const binOps=[
    [/^([\s\S]+)\bAND\b([\s\S]+)$/i,(a,b)=>a&&b],[/^([\s\S]+)\bOR\b([\s\S]+)$/i,(a,b)=>a||b],
    [/^([\s\S]+)>=([\s\S]+)$/,(a,b)=>a>=b],[/^([\s\S]+)<=([\s\S]+)$/,(a,b)=>a<=b],
    [/^([\s\S]+)<>([\s\S]+)$/,(a,b)=>a!=b],[/^([\s\S]+)!=([\s\S]+)$/,(a,b)=>a!=b],
    [/^([\s\S]+)=([\s\S]+)$/,(a,b)=>a==b],[/^([\s\S]+)>([\s\S]+)$/,(a,b)=>a>b],
    [/^([\s\S]+)<([\s\S]+)$/,(a,b)=>a<b],[/^([\s\S]+)\+([\s\S]+)$/,(a,b)=>a+b],
    [/^([\s\S]+)-([\s\S]+)$/,(a,b)=>a-b],[/^([\s\S]+)\*([\s\S]+)$/,(a,b)=>a*b],
    [/^([\s\S]+)\/([\s\S]+)$/,(a,b)=>b!=0?a/b:null],
  ];
  for(const[re,fn]of binOps){const m=expr.match(re);if(m){return fn(evalExpr(m[1].trim(),row),evalExpr(m[2].trim(),row));}}
  const nullM=expr.match(/^(.+)\s+IS\s+(NOT\s+)?NULL$/i);
  if(nullM){const v=evalExpr(nullM[1].trim(),row);return nullM[2]?v!=null:v==null;}
  const notM=expr.match(/^NOT\s+(.+)$/i);if(notM)return!evalExpr(notM[1].trim(),row);
  const fnM=expr.match(/^([A-Za-z_]\w*)\((.*?)?\)$/);
  if(fnM){
    const fn=fnM[1].toUpperCase(),args=(fnM[2]||'').split(',').map(a=>evalExpr(a.trim(),row));
    switch(fn){
      case'ROUND':return Math.round((args[0]||0)*Math.pow(10,args[1]||0))/Math.pow(10,args[1]||0);
      case'UPPER':return String(args[0]??'').toUpperCase();case'LOWER':return String(args[0]??'').toLowerCase();
      case'LENGTH':return String(args[0]??'').length;case'COALESCE':return args.find(a=>a!=null)??null;
      case'ABS':return Math.abs(args[0]??0);case'SUBSTR':return String(args[0]??'').substring((args[1]||1)-1,(args[1]||1)-1+(args[2]||999));
    }
  }
  if(row){const lk=expr.toLowerCase();for(const k of Object.keys(row)){if(k.toLowerCase()===lk)return row[k];}}
  return expr;
}

function applyAgg(fn,vals){
  fn=fn.toUpperCase();const nums=vals.filter(v=>v!=null&&v!=='');
  if(fn==='COUNT')return vals.filter(v=>v!=null&&v!=='').length;
  if(fn==='SUM')return nums.reduce((a,b)=>a+(+b),0);
  if(fn==='AVG')return nums.length?nums.reduce((a,b)=>a+(+b),0)/nums.length:null;
  if(fn==='MAX')return nums.length?Math.max(...nums.map(Number)):null;
  if(fn==='MIN')return nums.length?Math.min(...nums.map(Number)):null;
  return null;
}

function runSQL(rawSql){
  let sql=rawSql.replace(/--[^\n]*/g,'').replace(/\s+/g,' ').trim();
  if(sql.endsWith(';'))sql=sql.slice(0,-1).trim();
  const cteDB={};
  const withM=sql.match(/^WITH\s+([\s\S]+?)\s+(SELECT\s[\s\S]+)$/i);
  if(withM){
    let cteBlock=withM[1],mainQ=withM[2];
    const cteRe=/([A-Za-z_]\w*)\s+AS\s*\(([^)]+(?:\([^)]*\)[^)]*)*)\)/gi;
    let cm;
    while((cm=cteRe.exec(cteBlock))!==null){
      const r=runSQL(cm[2].trim());if(r.error)return r;
      cteDB[cm[1].toLowerCase()]=r;
    }
    return runSELECT(mainQ,cteDB);
  }
  return runSELECT(sql,cteDB);
}

function runSELECT(sql,cteDB={}){
  let orderByClause='',limitN=Infinity;
  const obM=sql.match(/ORDER\s+BY\s+([\s\S]+?)(?:\s+LIMIT\s|$)/i);
  if(obM){orderByClause=obM[1].trim();sql=sql.slice(0,sql.search(/ORDER\s+BY/i)).trim();}
  const limM=sql.match(/LIMIT\s+(\d+)/i);
  if(limM){limitN=parseInt(limM[1]);sql=sql.slice(0,sql.search(/LIMIT/i)).trim();}
  const selM=sql.match(/^SELECT\s+([\s\S]+?)\s+FROM\s+([\s\S]+)$/i);
  if(!selM)return{error:'Only SELECT queries are supported.'};
  let selectClause=selM[1],fromClause=selM[2],whereClause='',groupByClause='',havingClause='';
  const wM=fromClause.match(/^([\s\S]+?)\s+WHERE\s+([\s\S]+)$/i);
  if(wM){fromClause=wM[1];let rest=wM[2];const gM=rest.match(/^([\s\S]+?)\s+GROUP\s+BY\s+([\s\S]+)$/i);
    if(gM){whereClause=gM[1];let gb=gM[2];const hM=gb.match(/^([\s\S]+?)\s+HAVING\s+([\s\S]+)$/i);if(hM){groupByClause=hM[1];havingClause=hM[2];}else groupByClause=gb;}
    else{whereClause=rest;}}
  else{const gM=fromClause.match(/^([\s\S]+?)\s+GROUP\s+BY\s+([\s\S]+)$/i);
    if(gM){fromClause=gM[1];let gb=gM[2];const hM=gb.match(/^([\s\S]+?)\s+HAVING\s+([\s\S]+)$/i);if(hM){groupByClause=hM[1];havingClause=hM[2];}else groupByClause=gb;}}
  function resolveTable(name){
    const ln=name.toLowerCase();
    if(cteDB[ln])return cteDB[ln];
    if(DB[ln])return{cols:DB[ln].cols.slice(),rows:DB[ln].rows.map(r=>r.slice())};
    return null;
  }
  const fromParts=fromClause.trim().split(/\s+JOIN\s+/i);
  const mainFromM=fromParts[0].trim().match(/^(\w+)(?:\s+(?:AS\s+)?(\w+))?$/i);
  if(!mainFromM)return{error:'Cannot parse FROM: '+fromParts[0]};
  const mainAlias=(mainFromM[2]||mainFromM[1]).toLowerCase();
  const mainT=resolveTable(mainFromM[1]);
  if(!mainT)return{error:'Unknown table: '+mainFromM[1]};
  let workCols=mainT.cols.map(c=>mainAlias+'.'+c.toLowerCase());
  let workRows=mainT.rows.map(r=>r.slice());
  for(let ji=1;ji<fromParts.length;ji++){
    const onM=fromParts[ji].trim().match(/^([\s\S]+?)\s+ON\s+([\s\S]+)$/i);
    if(!onM)return{error:'JOIN missing ON'};
    const jtM=onM[1].trim().match(/^(\w+)(?:\s+(?:AS\s+)?(\w+))?$/i);
    if(!jtM)return{error:'Cannot parse JOIN table'};
    const jtAlias=(jtM[2]||jtM[1]).toLowerCase();
    const jt=resolveTable(jtM[1]);if(!jt)return{error:'Unknown table: '+jtM[1]};
    const jCols=jt.cols.map(c=>jtAlias+'.'+c.toLowerCase());
    const onParts=onM[2].split('=').map(s=>s.trim().toLowerCase());
    const newRows=[];
    workRows.forEach(lr=>{
      const lo={};workCols.forEach((c,i)=>{lo[c]=lr[i];lo[c.split('.')[1]]=lr[i];});
      const lVal=lo[onParts[0]]??lo[onParts[0].split('.').pop()];
      jt.rows.forEach(jr=>{
        const ro={};jCols.forEach((c,i)=>{ro[c]=jr[i];ro[c.split('.')[1]]=jr[i];});
        const rVal=ro[onParts[1]]??ro[onParts[1].split('.').pop()];
        if(lVal==rVal)newRows.push([...lr,...jr]);
      });
    });
    workCols=[...workCols,...jCols];workRows=newRows;
  }
  function toObj(row){const o={};workCols.forEach((c,i)=>{o[c]=row[i];o[c.split('.')[1]]=row[i];});return o;}
  if(whereClause)workRows=workRows.filter(r=>{try{return evalExpr(whereClause,toObj(r));}catch{return false;}});
  function parseSelectCols(clause){
    const cols=[],parts=[];let depth=0,cur='';
    for(const ch of clause){if(ch==='(')depth++;if(ch===')')depth--;if(ch===','&&depth===0){parts.push(cur.trim());cur='';}else cur+=ch;}
    parts.push(cur.trim());
    parts.forEach(p=>{const asM=p.match(/^(.+?)\s+AS\s+(\w+)$/i);if(asM)cols.push({expr:asM[1].trim(),alias:asM[2]});else cols.push({expr:p.trim(),alias:p.trim().replace(/[^a-z0-9_]/gi,'_')});});
    return cols;
  }
  const selCols=parseSelectCols(selectClause);
  const hasAgg=selCols.some(c=>/^(COUNT|SUM|AVG|MAX|MIN)\s*\(/i.test(c.expr));
  const isStar=selCols.length===1&&selCols[0].expr==='*';
  if(groupByClause||hasAgg){
    const gbCols=groupByClause?groupByClause.split(',').map(s=>s.trim().toLowerCase()):[];
    const groups={};
    workRows.forEach(row=>{
      const obj=toObj(row);
      const key=gbCols.length?gbCols.map(c=>obj[c]??obj[c.split('.').pop()]??'').join('||'):'__all__';
      if(!groups[key])groups[key]={rows:[],sample:obj};
      groups[key].rows.push(obj);
    });
    const outCols=selCols.map(c=>c.alias),outRows=[];
    Object.values(groups).forEach(g=>{
      const row=[];
      selCols.forEach(sc=>{
        const aggM=sc.expr.match(/^(COUNT|SUM|AVG|MAX|MIN)\s*\(\s*(DISTINCT\s+)?(\*|[\w.]+)\s*\)/i);
        if(aggM){
          const fn=aggM[1].toUpperCase(),dist=!!aggM[2],col=aggM[3];
          let vals=col==='*'?g.rows.map(()=>1):g.rows.map(r=>{const lc=col.toLowerCase();return r[lc]??r[lc.split('.').pop()];});
          if(dist)vals=[...new Set(vals.filter(v=>v!=null))];
          row.push(applyAgg(fn,vals));
        }else row.push(evalExpr(sc.expr,g.sample));
      });
      if(havingClause){const hr={};selCols.forEach((sc,i)=>hr[sc.alias]=row[i]);if(!evalExpr(havingClause,hr))return;}
      outRows.push(row);
    });
    workCols=outCols;workRows=outRows;
  }else if(isStar){
    workCols=workCols.map(c=>c.split('.').pop());
  }else{
    const outCols=selCols.map(c=>c.alias);
    const outRows=workRows.map(r=>{const obj=toObj(r);return selCols.map(sc=>{try{return evalExpr(sc.expr,obj);}catch{return null;}});});
    workCols=outCols;workRows=outRows;
  }
  if(orderByClause){
    const obParts=orderByClause.split(',').map(s=>{const dm=s.trim().match(/^(.+?)\s+(ASC|DESC)$/i);return dm?{col:dm[1].trim().toLowerCase(),dir:dm[2].toUpperCase()}:{col:s.trim().toLowerCase(),dir:'ASC'};});
    workRows.sort((a,b)=>{
      for(const{col,dir}of obParts){
        const ai=workCols.findIndex(c=>c.toLowerCase()===col);
        const av=ai>=0?a[ai]:null,bv=ai>=0?b[ai]:null;
        const cmp=av==null&&bv==null?0:av==null?1:bv==null?-1:av<bv?-1:av>bv?1:0;
        if(cmp!==0)return dir==='DESC'?-cmp:cmp;
      }return 0;
    });
  }
  if(limitN<Infinity)workRows=workRows.slice(0,limitN);
  return{cols:workCols.map(c=>c.split('.').pop()),rows:workRows};
}

function runSqlQuery(){
  const out=document.getElementById('sqlOutput'),btn=document.getElementById('runSql');
  btn.disabled=true; out.textContent='Running...';
  try{
    const sql=document.getElementById('sqlInput').value.trim();
    if(!sql){out.textContent='Type a query above.';btn.disabled=false;return;}
    const t0=Date.now(),res=runSQL(sql),ms=Date.now()-t0;
    if(res.error){out.innerHTML='<div class="output-error">'+res.error+'</div>';}
    else if(!res.rows.length){out.textContent='Query ran successfully — 0 rows returned. ('+ms+'ms)';}
    else{
      const max=200;
      let html='<table><tr>'+res.cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
      res.rows.slice(0,max).forEach(row=>{html+='<tr>'+row.map(v=>'<td>'+(v===null||v===undefined?'NULL':v)+'</td>').join('')+'</tr>';});
      html+='</table>';
      if(res.rows.length>max)html+=`<div style="font-size:12px;color:var(--sub);margin-top:6px">${res.rows.length} rows — showing first ${max}</div>`;
      else html+=`<div style="font-size:11px;color:var(--sub);margin-top:4px">${res.rows.length} row${res.rows.length!==1?'s':''} · ${ms}ms</div>`;
      out.innerHTML=html;
    }
  }catch(e){out.innerHTML='<div class="output-error">'+String(e)+'</div>';}
  finally{btn.disabled=false;}
}

  try{

      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        system:'You are a Python interpreter. Execute the given Python code exactly as written. Return ONLY the raw stdout output that print() statements would produce — no explanations, no markdown, no backticks. If there is a runtime error, return just the error message starting with "Error:".',
        messages:[{role:'user',content:'Execute this Python code and return only the output:\n\n'+code}]})});

}

function renderHeatmap(){
  const el=document.getElementById('heatmapView');
  el.innerHTML="";

  // Build activity map from checked tasks per day (using day task completion and notes timestamps)
  const startDate=STATE.startDate ? new Date(STATE.startDate+"T00:00:00") : null;
  const today=new Date();

  // Compute activity per calendar date
  const activityMap={};
  if(startDate){
    for(let d=1;d<=45;d++){
      const dayData=STATE.days[d];
      const doneTasks=dayData.tasks.filter(t=>t.done).length;
      const totalTasks=dayData.tasks.length;
      if(doneTasks===0) continue;
      const calDate=new Date(startDate);
      calDate.setDate(startDate.getDate()+d-1);
      const key=calDate.toISOString().slice(0,10);
      activityMap[key]= totalTasks>0 ? doneTasks/totalTasks : 0;
    }
  }

  // Stats
  const totalDone=Object.keys(STATE.days).filter(d=>{ const day=STATE.days[d]; return day.tasks.length>0 && day.tasks.every(t=>t.done); }).length;
  const totalTasks=Object.values(STATE.days).reduce((a,d)=>a+d.tasks.filter(t=>t.done).length,0);
  let streak=0; let streakBroken=false;
  for(let d=1;d<=45;d++){
    const day=STATE.days[d];
    if(day.tasks.length>0 && day.tasks.every(t=>t.done)) streak++;
    else if(d<=(startDate ? Math.floor((today-startDate)/86400000)+1 : 1)) { streakBroken=true; if(streakBroken && streak>0) break; }
  }

  const statRow=document.createElement('div'); statRow.className="hm-stat-row";
  [{label:"Days Complete",val:totalDone+"/45"},{label:"Tasks Done",val:totalTasks},{label:"Current Streak",val:streak+" days"},{label:"Days Remaining",val:startDate?Math.max(0,45-Math.floor((today-startDate)/86400000))+" days":"Set start date"}].forEach(s=>{
    const st=document.createElement('div'); st.className="hm-stat";
    const b=document.createElement('b'); b.textContent=s.val;
    const sp=document.createElement('span'); sp.textContent=s.label;
    st.appendChild(b); st.appendChild(sp); statRow.appendChild(st);
  });
  el.appendChild(statRow);

  if(!startDate){
    const msg=document.createElement('div'); msg.className="ai-hint"; msg.style.textAlign="center"; msg.style.padding="20px";
    msg.textContent="Set your start date in the Tracker tab to see your activity heatmap.";
    el.appendChild(msg); return;
  }

  // Build 45-day heatmap in weekly columns
  const hintEl=document.createElement('div'); hintEl.className="ai-hint"; hintEl.textContent="Each cell = one day of your 45-day plan. Colour = how many tasks you completed that day.";
  el.appendChild(hintEl);

  const dayLabels=document.createElement('div'); dayLabels.style.cssText="display:flex;align-items:flex-start;gap:4px;";
  const dayLbl=document.createElement('div'); dayLbl.className="hm-day-labels";
  ["Mon","","Wed","","Fri","","Sun"].forEach(l=>{ const d=document.createElement('div'); d.style.cssText="height:14px;line-height:14px;"; d.textContent=l; dayLbl.appendChild(d); });
  dayLabels.appendChild(dayLbl);

  const grid=document.createElement('div'); grid.className="heatmap-grid";
  // Group days into columns of 7 (weeks)
  const cols=Math.ceil(45/7);
  for(let col=0;col<cols;col++){
    const colEl=document.createElement('div'); colEl.className="heatmap-col";
    for(let row=0;row<7;row++){
      const dayNum=col*7+row+1;
      const cell=document.createElement('div'); cell.className="hm-cell";
      if(dayNum<=45){
        const calDate=new Date(startDate);
        calDate.setDate(startDate.getDate()+dayNum-1);
        const key=calDate.toISOString().slice(0,10);
        const ratio=activityMap[key]||0;
        if(ratio>=0.99) cell.classList.add('l3');
        else if(ratio>=0.5) cell.classList.add('l2');
        else if(ratio>0) cell.classList.add('l1');
        cell.title=`Day ${dayNum} — ${calDate.toLocaleDateString('en-IN',{month:'short',day:'numeric'})} — ${Math.round(ratio*100)}% complete`;
      } else {
        cell.style.opacity="0";
      }
      colEl.appendChild(cell);
    }
    grid.appendChild(colEl);
  }
  dayLabels.appendChild(grid);
  el.appendChild(dayLabels);

  const legend=document.createElement('div'); legend.className="heatmap-legend";
  legend.innerHTML=`<span>Less</span>
    <div class="hm-cell" style="width:14px;height:14px;"></div>
    <div class="hm-cell l1" style="width:14px;height:14px;"></div>
    <div class="hm-cell l2" style="width:14px;height:14px;"></div>
    <div class="hm-cell l3" style="width:14px;height:14px;"></div>
    <span>More</span>`;
  el.appendChild(legend);

  // Day-by-day breakdown of missed days
  const missed=[];
  for(let d=1;d<=45;d++){
    const calDate=new Date(startDate); calDate.setDate(startDate.getDate()+d-1);
    if(calDate>today) break;
    const day=STATE.days[d];
    const done=day.tasks.filter(t=>t.done).length;
    if(done<day.tasks.length) missed.push(`Day ${d} (${calDate.toLocaleDateString('en-IN',{month:'short',day:'numeric'})}): ${done}/${day.tasks.length} tasks`);
  }
  if(missed.length){
    const missBox=document.createElement('div'); missBox.className="ai-panel"; missBox.style.marginTop="14px";
    missBox.innerHTML=`<h3>⚠️ Incomplete Days (${missed.length})</h3>`;
    const ul=document.createElement('ul'); ul.style.cssText="margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--sub);line-height:1.8;";
    missed.forEach(m=>{ const li=document.createElement('li'); li.textContent=m; ul.appendChild(li); });
    missBox.appendChild(ul); el.appendChild(missBox);
  }
}

function setView(view){
  STATE.ui.view = view;
  const views=["tracker","prep","theory","cheat","cards","quiz","code","mock","jd","explain","star","company","heatmap"];
  views.forEach(v=>{
    const el=document.getElementById(v+'View');
    if(el) el.style.display=v===view?"":"none";
    const id='tab'+v.charAt(0).toUpperCase()+v.slice(1);
    const btn=document.getElementById(id);
    if(btn) btn.className=v===view?"active":"";
  });
  if(view==="prep") renderPrep();
  if(view==="theory") renderTheory();
  if(view==="cheat") renderCheatSheet();
  if(view==="cards") renderFlashcards();
  if(view==="quiz") initQuiz();
  if(view==="code") renderCodeEditor();
  if(view==="mock") renderMock();
  if(view==="jd") renderJD();
  if(view==="explain") renderExplain();
  if(view==="star") renderStar();
  if(view==="company") renderCompany();
  if(view==="heatmap") renderHeatmap();
}
["tracker","prep","theory","cheat","cards","quiz","code","mock","jd","explain","star","company","heatmap"].forEach(v=>{
  const btn=document.getElementById('tab'+v.charAt(0).toUpperCase()+v.slice(1));
  if(btn) btn.onclick=()=>{ setView(v); scheduleSave(); };
});

/* ---------- Boot ---------- */
(async function(){
  await initArtifact();
  buildUI();
  setView((STATE.ui && STATE.ui.view) || "tracker");
})();
</script></body></html>
